<!doctype html>
<html lang="en" data-template="farm">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Farmer CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<script src="../config.js"></script>
<script src="../track.js"></script>
<script src="../curriculum/diagrams.js"></script>
<style>
:root{--leaf:#3E7B3A;--leaf2:#72AA5C;--soil:#7E5A3B;--soil2:#B48A5E;--trunk:#6A4A2E;--onsoil:#FFF5E4;--sky:#DDEBF1;--sky2:#4F8AB0;--meadow:#DCEBC8;--gold:#F0B93A;--gold-d:#A9760F;--bloom:#D3648A;--apple:#C9473B;--bad:#B83E33;--good:#2C7F45;--skin:#E5B68C;--paper:#FFFFFF;--rock:#9AA095;--bg:#FFFFFF;--card:#fff;--ink:#2B3A2E;--muted:#5F6B63;--line:#E6EBE1;--accent:#3A8A1C;--accent-ink:#fff;--warn:#B4530A;--soft:#EAF6E1;--accent-d:#2A6812;--soft2:#F3F6EF;--brand:#5BB82E;--sun:#F5B700;--sun-d:#C99600;--sky3:#2E9BD6;--sky3-d:#1C7AAE;--skysoft:#E0F0FA;--flame:#FF9F1C;--lock:#E6EBE1;--lock-d:#CDD5C7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--leaf:#5FA552;--leaf2:#3F7A36;--soil:#4E3824;--soil2:#7A5B3B;--trunk:#8C6A47;--onsoil:#F3E7D3;--sky:#1C2D35;--sky2:#6EA8CC;--meadow:#1F2E1B;--gold:#F2C24E;--gold-d:#E6AE3A;--bloom:#E07FA0;--apple:#E06A5C;--bad:#E46B5E;--good:#5DC27B;--skin:#D2A07A;--paper:#263027;--rock:#5E655A;--bg:#121512;--card:#1b201c;--ink:#e7ebe7;--muted:#9aa49d;--line:#2c332d;--accent:#6CC24A;--accent-ink:#0d130f;--warn:#e19a62;--soft:#1f2a22;--accent-d:#3E8E22;--soft2:#1A1F1B;--brand:#5BB82E;--sun:#F2C24E;--sun-d:#B38A1E;--sky3:#4AAEE3;--sky3-d:#1C7AAE;--skysoft:#16303D;--flame:#FFAE45;--lock:#2C332D;--lock-d:#232924}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header[hidden]{display:none}
a{color:var(--accent)}
header h1{font-size:16px;margin:0;margin-right:auto}
nav button{background:none;border:0;color:var(--muted);font:inherit;padding:6px 10px;border-radius:6px;cursor:pointer}
nav button.on{background:var(--soft);color:var(--accent);font-weight:600}
main{padding:20px;max-width:1400px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:7px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:4px 9px;font-size:13px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.muted{color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
.tablewrap{overflow-x:auto}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:200px}
.col h3{font-size:13px;margin:0 0 2px}
.col .n{font-size:12px;color:var(--muted);margin-bottom:8px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;cursor:pointer}
.chip b{display:block;font-size:14px}
.chip small{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.stat .v{font-size:24px;font-weight:700}
.stat .k{font-size:12px;color:var(--muted)}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;background:var(--soft);color:var(--accent)}
.tag.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:min(560px,94vw);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.4)}
.auth{max-width:380px;margin:8vh auto}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45;color:var(--ink);margin:14px 0 4px}
.agree input{width:auto;margin:3px 0 0;flex:none}
.banner{max-width:1400px;margin:16px auto 0;padding:0 20px}
#subnav{max-width:1400px;margin:0 auto;padding:16px 20px 0}
.subtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px;background:var(--soft2);border:2px solid var(--line);border-radius:16px;width:max-content;max-width:100%;box-sizing:border-box}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:none;display:flex;align-items:center;gap:6px;background:none;border:0;border-radius:12px;padding:8px 14px;min-height:40px;font:inherit;font-weight:800;color:var(--muted);cursor:pointer;white-space:nowrap}
.subtabs button svg{width:18px;height:18px;flex:none}
.subtabs button.on{background:var(--card);color:var(--accent);box-shadow:0 2px 0 var(--line)}
.subtabs button.locked{opacity:.45;cursor:not-allowed}
.subtabs .lk{font-size:11px;font-weight:800;background:var(--lock);border-radius:99px;padding:1px 7px}
.banner .card{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-color:var(--accent)}
.err{color:var(--warn);font-size:14px;min-height:1.2em;margin-top:8px}
.trades{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-bottom:16px}
.lockedcol,.lvl.locked{opacity:.55;border-style:dashed}
.lvl{margin-bottom:10px}.lvl .num{display:inline-block;width:26px;height:26px;border-radius:50%;background:var(--soft);color:var(--accent);text-align:center;line-height:26px;font-weight:700;margin-right:8px}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
/* learn: lessons, quizzes */
.chipbtn{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:99px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.chipbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lgroup{margin:0 0 6px}.lgroup h3{font-size:16px;margin:16px 0 2px}.lgroup>p{margin:0 0 8px;font-size:14px}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-bottom:16px}
.lessonbtn{display:grid;grid-template-columns:110px 1fr;gap:12px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;padding:10px;align-items:center}
.lessonbtn b{display:block;margin:2px 0}.lessonbtn small{display:block}.lessonbtn .tag{margin-top:4px}
.lthumb svg,.ldiagram svg{display:block;width:100%;height:auto;border-radius:6px}
.quizcard{max-width:720px;margin-bottom:12px}.quizcard textarea{margin:6px 0}
.qa{border-top:1px solid var(--line);margin-top:10px;padding-top:10px;font-size:14px}
.player{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}.player .bar{height:10px;border-radius:99px}
.player .lcard{font-size:18px;line-height:1.5;margin:14px 0}.metaphor{font-style:italic;color:var(--muted);margin:10px 0 0}
.ldiagram{margin-bottom:12px}.nichepick{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 10px}.nichepick .chipbtn{font-size:13px;padding:4px 10px}.player>.btn{align-self:flex-start}
.welcome{border-color:var(--accent);background:linear-gradient(180deg,var(--soft),var(--card) 70%)}
.behind{margin-top:10px;font-size:14px}
.nextstep{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.todo{margin:8px 0 0;padding-left:18px}.todo li{margin:4px 0}
.histday{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 4px}
.histrow{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.histicon{width:22px;flex:none;text-align:center}
.histnote{margin-top:4px;padding:6px 10px;background:var(--soft2);border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere}
.histrow details{margin-top:4px}.histrow ol{margin:4px 0}
.qa{padding:10px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.qa:last-child{border-bottom:0}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--accent);text-align:left;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:99px;background:var(--warn);color:#fff;font-size:11px;line-height:18px;text-align:center;font-weight:700}
.studgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:12px}.stud{margin:0}.stud.empty{border-style:dashed;opacity:.75}
.tpicks{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:12px}
.tpick{text-align:left;font:inherit;color:var(--ink);cursor:pointer;margin:0}.tpick:hover{border-color:var(--accent)}.tpick.on{border:2px solid var(--accent)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:14px}
.bar.money{display:flex;height:10px}.bar.money i.owed{background:var(--gold)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;cursor:pointer}
.opt.right{border-color:var(--good)}.opt.wrong{border-color:var(--bad)}
.result.pass{border-color:var(--good)}.result.fail{border-color:var(--bad)}
.dg .sky{fill:var(--sky)}
.dg .meadow{fill:var(--meadow)}
.dg .zone{fill:var(--meadow);stroke:var(--soil2);stroke-width:1.5;stroke-dasharray:5 4}
.dg .town{fill:var(--paper);stroke:var(--leaf);stroke-width:1.2}
.dg .townh{fill:var(--paper);stroke:var(--gold-d);stroke-width:2}
.dg .dim{opacity:.45}
.dg .soil{fill:var(--soil)}
.dg .soil2{fill:var(--soil2)}
.dg .rocky{fill:var(--soil2)}
.dg .rock{fill:var(--rock)}
.dg .leaf{fill:var(--leaf)}
.dg .leaf2{fill:var(--leaf2)}
.dg .stem{stroke:var(--leaf);stroke-width:2.5;fill:none;stroke-linecap:round}
.dg .bloom{fill:var(--bloom)}
.dg .gold{fill:var(--gold)}
.dg .apple{fill:var(--apple)}
.dg .sky2{fill:var(--sky2)}
.dg .wilt{fill:var(--rock)}
.dg .trunk{fill:var(--trunk)}
.dg .trunkl{stroke:var(--trunk);stroke-width:2.5;fill:none;stroke-linecap:round}
.dg .root{stroke:var(--soil2);fill:none;stroke-linecap:round}
.dg .skin{fill:var(--skin)}
.dg .shirt1{fill:var(--accent)}
.dg .shirt2{fill:var(--sky2)}
.dg .shirt3{fill:var(--bloom)}
.dg .ink{fill:var(--ink)}
.dg .paper{fill:var(--paper);stroke:var(--line);stroke-width:1.2}
.dg .pbad{stroke:var(--bad);stroke-width:1.8}
.dg .pgood{stroke:var(--good);stroke-width:1.8}
.dg .t{fill:var(--ink);font-family:Inter,system-ui,sans-serif;font-weight:600}
.dg .tm{fill:var(--muted)}
.dg .onsoil{fill:var(--onsoil)}
.dg .bad{fill:var(--bad)}
.dg .good{fill:var(--good)}
.dg .ar{stroke:var(--ink);stroke-width:1.8;fill:none}
.dg .arh{fill:var(--ink)}
.dg .ag{stroke:var(--gold-d);stroke-width:2.2;fill:none}
.dg .agh{fill:var(--gold-d)}
.dg .ab{stroke:var(--sky2);stroke-width:1.6;fill:none}
.dg .abh{fill:var(--sky2)}
.dg .xbad{stroke:var(--bad);stroke-width:3.5;stroke-linecap:round;fill:none}
.dg .okbg{fill:var(--good)}
.dg .okl{stroke:var(--card);stroke-width:2.5;fill:none;stroke-linecap:round}
.dg .weave{stroke:var(--trunk);stroke-width:1;fill:none;opacity:.6}
.dg .ray{stroke:var(--gold);stroke-width:2.2;stroke-linecap:round}
.dg .rail{stroke:var(--trunk);stroke-width:3;fill:none}
.dg .trail{stroke:var(--soil2);stroke-width:14;fill:none;stroke-linecap:round}
.dg .trail2{stroke:var(--soil2);stroke-width:10;fill:none}
.dg .barn{fill:var(--apple)}
.dg .roofl{stroke:var(--ink);stroke-width:3;fill:none}
.dg .beak{fill:var(--gold-d)}
.dg .bird{fill:var(--sky2)}
.dg .puff{fill:var(--paper);stroke:var(--line)}
.dg .seedl{stroke:var(--muted);stroke-width:1;fill:none}
.dg .cloudf{fill:var(--paper);stroke:var(--line)}
.dg .breeze{stroke:var(--sky2);stroke-width:2;fill:none;stroke-linecap:round}
.dg .phone{fill:var(--ink)}
.dg .axis{stroke:var(--muted);stroke-width:1}
.dg .axisl{stroke:none}
.dg .owl{fill:var(--soil2)}
.dg .arm{stroke:var(--skin);stroke-width:4;stroke-linecap:round;fill:none}
.dg .lead{stroke:var(--muted);stroke-width:1;fill:none}
.dg .stripe{stroke:var(--ink);stroke-width:2.5}
.dg .wing{fill:var(--paper);opacity:.85;stroke:var(--line)}
.dg .wasp{fill:var(--gold-d)}
.dg .web{stroke:var(--muted);stroke-width:.8;fill:none;opacity:.7}
.dg .node{fill:var(--paper);stroke:var(--leaf);stroke-width:2}
.dg .ladderl{stroke:var(--trunk);stroke-width:4;stroke-linecap:round;fill:none}
.dg .motion{stroke:var(--muted);stroke-width:1.5;stroke-linecap:round}
.dg .water{stroke:var(--sky2);stroke-width:3;fill:none;opacity:.6}
.dg .ghost{fill:none;stroke:var(--muted);stroke-dasharray:3 3}
.dg .shear{stroke:var(--muted);stroke-width:3;stroke-linecap:round}
.dg .shearo{fill:none;stroke:var(--muted);stroke-width:2}
.dg .tag{stroke:var(--muted);stroke-width:1.2}
.dg .pot{fill:var(--apple)}
.dg .awning{fill:var(--apple)}
.dg .awnl{stroke:var(--paper);stroke-width:4}
@media (max-width:640px){main{padding:16px}.lessonbtn{grid-template-columns:90px 1fr}.grid2{grid-template-columns:1fr}}

/* ---------- Dashboard template "farm" (the default; Duolingo-inspired: chunky buttons, rounded type, trail). Other templates are at the end of this stylesheet and override these rules under :root[data-template="..."]. ---------- */
body{font-family:Nunito,system-ui,sans-serif;font-weight:600;background:var(--bg)}
h1,h2,h3,b,th{font-weight:900}
.card{border:2px solid var(--line);border-radius:18px}
.btn{border-radius:14px;padding:11px 18px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;font-size:14px;box-shadow:0 4px 0 var(--accent-d);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-d)}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.ghost:active{box-shadow:0 1px 0 var(--line)}
.btn.sm{padding:6px 12px;font-size:12px;border-radius:12px}
input,select,textarea{border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--soft2);font-weight:700}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--sky3)}
label{font-weight:800}
.tag{font-weight:800;padding:2px 10px}
.bar{height:12px;border-radius:99px;background:var(--lock)}.bar i{border-radius:99px;background:var(--brand);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
dialog{border:2px solid var(--line);border-radius:20px}
.stat .v{font-weight:900}
.chip,.col{border-width:2px;border-radius:14px}
/* app frame: side menu on desktop, bottom bar on phones */
header{border-bottom:2px solid var(--line)}
header h1{font-size:20px;font-weight:900;color:var(--accent);display:flex;align-items:center;gap:8px}
nav button{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:.03em;text-transform:uppercase;font-size:14px;border:2px solid transparent;border-radius:14px;padding:9px 12px;color:var(--muted)}
nav button svg{flex:none;pointer-events:none}
nav button.on{background:var(--soft);border-color:#9FD57A;color:var(--accent)}
nav button:hover:not(.on){background:var(--soft2)}
@media (min-width:900px){
  header:not([hidden]){position:fixed;top:0;left:0;bottom:0;width:236px;flex-direction:column;align-items:stretch;gap:6px;padding:24px 14px;border-bottom:0;border-right:2px solid var(--line);overflow-y:auto}
  header h1{margin:0 8px 18px}
  header nav{display:flex;flex-direction:column;gap:4px;flex:1}
  header #who{padding:0 12px;font-weight:800}
  header #logout,header #siteview{margin:4px 12px 0}
  header:not([hidden]) ~ main, header:not([hidden]) ~ #banner, header:not([hidden]) ~ #subnav{margin-left:236px}
  #subnav{padding:20px 36px 0}
  main{padding:28px 36px 48px}
}
@media (max-width:899px){
  header:not([hidden]) ~ main{padding-bottom:96px}
  header nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;gap:2px;overflow-x:auto;background:var(--card);border-top:2px solid var(--line);padding:6px 6px 10px}
  header nav button{flex-direction:column;gap:2px;font-size:10px;padding:6px 8px;min-width:64px;min-height:48px;justify-content:center}
  header #who{display:none}
}
/* home */
.homegrid{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
.homemain{flex:1 1 520px;max-width:660px;min-width:0;display:flex;flex-direction:column;gap:14px}
.homemain .lvl{margin-bottom:0}
#farmland h3{font-size:15px;margin:14px 0 6px}
.nichelist{margin:0;padding-left:22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 16px;font-size:14px}
.nichelist li{min-width:0}.nichelist small{color:var(--muted);font-variant-numeric:tabular-nums}
.fgrid{font-size:13px;font-variant-numeric:tabular-nums}.fgrid th,.fgrid td{text-align:center;padding:4px 5px}.fgrid th:first-child,.fgrid td:first-child{text-align:left;white-space:nowrap}
.fgrid .s{color:var(--gold-d);font-weight:800}.fgrid .f{color:var(--leaf)}.fgrid .e{color:var(--line)}
#farmland summary{cursor:pointer;font-weight:700;margin-top:12px}
.homeside{flex:0 1 320px;min-width:260px;display:flex;flex-direction:column;gap:16px}
.welcome{display:flex;gap:16px;align-items:flex-end;border:0;background:none;padding:0}
.welcome .mascot{flex:none;width:92px}
.welcome .bubble{flex:1;border:2px solid var(--line);border-radius:18px;padding:14px 18px;margin-bottom:24px;background:var(--card)}
.welcome #greeting{font-size:20px;line-height:1.35;font-weight:800;margin:0}
.nextcard{background:var(--accent);color:#fff;border-radius:20px;padding:20px 22px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;box-shadow:0 5px 0 var(--accent-d)}
.nextcard small{font-weight:900;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.nextcard #nexttext{display:block;font-size:20px;line-height:1.3;margin-top:4px}
.nextcard .btn{background:#fff;color:var(--accent);box-shadow:0 4px 0 #CFE9BD;margin-left:auto}
.dash h3{font-size:16px;margin:22px 0 8px}.dash .stats{margin-bottom:0}
.dash .stat .v{font-size:22px}.dash .stat small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.gsteps{list-style:none;margin:6px 0 8px;padding:0;display:flex;flex-direction:column;gap:6px}
.gstep{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:14px}.gstep label{display:flex;align-items:center;gap:8px;margin:0;font-size:14px;font-weight:500;flex:1 1 220px}
.gstep input[type=checkbox]{width:auto;margin:0}.gstep.done label span{text-decoration:line-through;color:var(--muted)}
.goals{display:flex;flex-direction:column;gap:10px}.goal.hit{border-color:var(--leaf,var(--accent))}
.needs{display:flex;flex-direction:column;gap:8px}.needs .row{justify-content:space-between;flex-wrap:nowrap}

<main id="app"></main>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const C = { PRICE: 499, ...window.CRM_CONFIG };  // PRICE fallback covers a cached older config.js
// invite links (admin-sent) land the same way as reset links: signed in, but with no password yet
const inviting = /type=invite/.test(location.hash + location.search);
let recovering = inviting || /type=recovery/.test(location.hash + location.search);
let linkError = new URLSearchParams(location.hash.slice(1)).get("error_description");
const sb = createClient(C.SUPABASE_URL, C.SUPABASE_KEY);
const $ = (s) => document.querySelector(s);
const app = $("#app"), dlg = $("#dlg");
// dashboard templates (Settings). The last pick is cached so the page opens in it before sign-in finishes.
const TEMPLATES = [
  ["farm", "Farm", "Rounded and playful, with the 90-day trail and the mascot.", ["#fff", "#5BB82E", "#F5B700"]],
  ["clean", "Clean", "Light page with a dark navy menu and blue accents.", ["#1C2434", "#F1F5F9", "#3C50E0"]],
  ["nightbarn", "Night barn", "Dark navy with colored stat tiles.", ["#1E2235", "#2570C2", "#127A70"]],
  ["sunrise", "Sunrise", "Near-black with a big clock greeting.", ["#0A0A0B", "#141416", "#4ADE80"]],
  ["almanac", "Almanac", "Deep navy grid of tiles, menu across the top.", ["#021B2E", "#0B2B44", "#CFE8FF"]],
];
function applyTemplate(t) {
  if (!TEMPLATES.some(([k]) => k === t)) t = "farm";
  document.documentElement.dataset.template = t;
  try { localStorage.setItem("lf_template", t); } catch {}
}
try { applyTemplate(localStorage.getItem("lf_template")); } catch { applyTemplate("farm"); }
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = (n) => "$" + Number(n || 0).toLocaleString(undefined, {maximumFractionDigits: 2});

sb.auth.onAuthStateChange((event, session) => {
  if (event === "USER_UPDATED") return; // new password saved; the form handles what's next
  if (event === "PASSWORD_RECOVERY") recovering = true;
  if (recovering && session) return newPasswordView();
  // supabase-js warns against awaiting its own calls inside this callback
  setTimeout(() => signedIn(session));
});

async function signedIn(session) {
  if (!session) { me = null; return authView(SIGNUP ? "up" : "in"); }
  const { data } = await sb.from("profiles").select("*").eq("id", session.user.id).single();
  if (me?.id !== data?.id) view = "home";  // every sign-in opens on Home
  if (DISCORD_BACK && data) { view = "settings"; history.replaceState(null, "", location.pathname); }
  me = data;
  applyTemplate(me?.dashboard_template);
  await loadRef();
  boot();
}

function trackPurchase() {
  if (!me?.enrollment_paid || me.role === "admin" || me.comp || !me.enrolled_at || Date.now() - new Date(me.enrolled_at) > 2 * 864e5) return;
  const k = "lf_purchase_" + me.id;
  try { if (localStorage.getItem(k)) return; localStorage.setItem(k, "1"); } catch { return; }
  window.lfTrack?.("Purchase", { value: Number(me.enrollment_fee || C.PRICE), currency: "USD" });
}

  }

// ---------- farmer: home (level ladder + next step) ----------
async function home() {
  if (me.role === "admin") return adminHome();
  // pick up an approval that happened since sign-in
  const { data: fresh } = await sb.from("profiles").select("*").eq("id", me.id).single();
  if (fresh && fresh.level !== me.level) { me = fresh; await loadRef(); return boot(); }
  if (fresh) Object.assign(me, { niche: fresh.niche, niche_approved_at: fresh.niche_approved_at, niche_submitted_at: fresh.niche_submitted_at, niche_note: fresh.niche_note, towns: fresh.towns });
  const [{ data: ladder }, { data: reqs }, cs, { data: passes }] = await Promise.all([
    sb.rpc("level_ladder"),
    sb.from("level_requests").select("*").eq("farmer_id", me.id).order("created_at", { ascending: false }),
    myContractors(),
    sb.from("quiz_passes").select("quiz").eq("farmer_id", me.id),
  ]);
  const L = lvl(), last = (reqs || [])[0], pending = last?.status === "pending";
  const top = Math.max(0, ...cs.filter((c) => c.farmer_id === me.id).map((c) => c.stage));
  const ready = (L === 1 && top >= 3) || (L === 2 && top >= 6);

// Live numbers a benchmark can track, from growth_numbers(). [label, format]
const GROWTH_METRICS = {
  revenue: ["Enrollment revenue", "money"], payers: ["Paying farmers"], new_paid_week: ["New paying farmers, last 7 days"],
  new_paid_4wk: ["New paying farmers, last 4 weeks"], calls_booked_week: ["Calls booked, last 7 days"], calls_booked: ["Calls booked, all time"],
  show_rate: ["Call show rate", "pct"], ad_spend: ["Ad spend", "money"], ad_sales: ["Sales from ads"], cost_per_sale: ["Cost per sale from ads", "money"],
  referral_sales: ["Sales from referrals"], activated_pct: ["Paying farmers with contractors", "pct"], active_week_pct: ["Paying farmers active this week", "pct"],
  leads_sent: ["Leads sent by farmers"], farmers_with_fee: ["Farmers who earned a fee"], level2: ["Farmers at level 2 or higher"],
};
const gfmt = (k, v) => v == null ? "—" : GROWTH_METRICS[k]?.[1] === "money" ? money(v) : GROWTH_METRICS[k]?.[1] === "pct" ? Math.round(v) + "%" : Number(v).toLocaleString();
const goalHit = (g, N) => {
  if (!g.metric) return !!g.done_at;
  const v = N[g.metric];
  return v != null && g.target != null && (g.lower_is_better ? Number(v) <= Number(g.target) : Number(v) >= Number(g.target));
};
async function growth() {
  const [{ data: N, error }, { data: items, error: e2 }, { data: TB }] = await Promise.all([sb.rpc("growth_numbers"), sb.from("growth_items").select("*").order("sort_order").order("id"), sb.rpc("teacher_board")]);
  if (error || e2 || !N) return (app.innerHTML = `<p class="err">Couldn't load Growth${error || e2 ? ": " + esc((error || e2).message) : ""}</p>`);
  const goals = items.filter((i) => i.kind === "goal"), steps = items.filter((i) => i.kind === "step");
  const today = new Date().toLocaleDateString("en-CA");
  const rev = Number(N.revenue || 0), daysLeft = Math.max(0, Math.ceil((new Date("2026-12-31T23:59:59") - Date.now()) / 864e5));
  const toGo = Math.max(0, Math.ceil((GOAL - rev) / C.PRICE)), perWeek = daysLeft ? toGo / (daysLeft / 7) : toGo, pace = Number(N.new_paid_4wk || 0) / 4;

      || `<div class="card muted">No questions waiting.</div>`}`);
  app.querySelectorAll("[data-ans]").forEach((b) => b.onclick = async () => {
    const { error } = await sb.rpc("answer_question", { p_id: b.dataset.ans, p_answer: app.querySelector(`[data-ansbox="${b.dataset.ans}"]`).value });

// ---------- farmer: the 90-day refund program ----------
const DAY = 864e5;
const onDay = (t0, n) => new Date(new Date(t0).getTime() + n * DAY).toLocaleDateString();
const csvOf = (rows) => {
  const cols = [...new Set(rows.flatMap((r) => Object.keys(r)))];
  const cell = (v) => { const s = v == null ? "" : String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  return [cols.join(","), ...rows.map((r) => cols.map((c) => cell(r[c])).join(","))].join("\n");
};
const download = (name, text) => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "text/csv" })); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
// CRM records as CSV files, straight from the database (the reviewer checks the package against these)
const evidenceButtons = (key) => ["contractors", "calls", "comments", "leads", "upsells"]
  .map((k) => `<button class="btn ghost sm" data-ev="${k}" data-evf="${key}">${k[0].toUpperCase() + k.slice(1)} CSV</button>`).join(" ");
const wireEvidence = (farmer, who) => app.querySelectorAll(`[data-evf="${farmer || "me"}"]`).forEach((b) => b.onclick = async () => {
  const { data, error } = await sb.rpc("refund_evidence", farmer ? { p_farmer: farmer } : {});
  if (error) return alert(error.message);
  download(`${who}-${b.dataset.ev}.csv`.replace(/[^\w.-]+/g, "_"), csvOf(data[b.dataset.ev] || []));
});
const progressTable = (pr) => `<div class="tablewrap"><table><thead><tr><th>Step</th><th>Goal</th><th>Due</th><th>Where you are</th><th></th></tr></thead><tbody>
  ${pr.steps.map((s) => `<tr data-step="${s.n}"><td><b>${s.n}. ${esc(s.name)}</b></td><td>${esc(s.quota)}</td>
    <td style="white-space:nowrap">Day ${s.deadline}<br><small class="muted">${onDay(pr.paid_at, s.deadline)}</small></td>
    <td>${esc(s.progress)}</td><td>${s.met ? `<span class="tag">Met</span>` : pr.day > s.deadline ? `<span class="tag warn">Missed</span>` : `<span class="muted">Open</span>`}</td></tr>`).join("")}
  ${pr.rules.map((r) => `<tr><td colspan="3"><b>${esc(r.name)}</b></td><td>${esc(r.progress)}</td><td>${r.met ? `<span class="tag">Met</span>` : `<span class="muted">Open</span>`}</td></tr>`).join("")}
  ${pr.fees != null ? `<tr id="refundamt"><td colspan="3"><b>Referral fees received</b><br><small class="muted">Paid to you by day 90${Number(pr.bonuses) > 0 ? `, plus ${money(pr.bonuses)} in recruiting bonuses` : ""}. The refund is the ${money(pr.price)} you paid minus these.</small></td><td>${money(Number(pr.fees) + Number(pr.bonuses || 0))}</td>
    <td style="white-space:nowrap">${Number(pr.refund_amount) > 0 ? `Refund: <b>${money(pr.refund_amount)}</b>` : `<span class="tag">Paid for itself</span>`}</td></tr>` : ""}
  </tbody></table></div>`;

async function program() {
  const [{ data: pr, error }, { data: reqs }] = await Promise.all([
    sb.rpc("refund_progress"),
    sb.from("refund_requests").select("*").eq("farmer_id", me.id).order("created_at", { ascending: false }),
  ]);
  if (error) return (app.innerHTML = `<div class="card err">${esc(error.message)}</div>`);
  if (!pr?.enrolled) return (app.innerHTML = `<div class="card muted">Your 90 days start the day your enrollment is paid.</div>`);
  const last = (reqs || [])[0], s0 = pr.steps[0], open = last && last.status !== "denied";
  const day = Math.min(pr.day, 90), late = new Date() > new Date(pr.submit_by);
  const packageCard = () => {
    if (last?.status === "approved") return `<p><span class="tag">Approved</span> Your refund${last.progress?.refund_amount != null ? " of " + money(last.progress.refund_amount) : ""} was approved ${new Date(last.reviewed_at).toLocaleDateString()}. It goes back to the card you paid with.</p>`;
    if (last?.status === "pending") return `<p><span class="tag">Sent ${new Date(last.created_at).toLocaleDateString()}</span> Alex or a verifier is checking it and may call a few of your contractors or customers.</p>`;
    const denied = last?.status === "denied" ? `<p class="err">Your last package was turned down${last.review_note ? ": " + esc(last.review_note) : ""}.</p>` : "";
    if (late) return denied + `<p class="muted">The refund window closed on day 97 (${new Date(pr.submit_by).toLocaleDateString()}).</p>`;
    if (Number(pr.refund_amount) <= 0) return denied + `<p>What you've received in referral fees${pr.bonuses_count === false ? "" : " and recruiting bonuses"} reached ${money(Number(pr.fees) + Number(pr.bonuses || 0))}, so the method paid for itself and no refund is owed.</p>`;
    if (!pr.all_met) return denied + `<p class="muted">The button opens once every goal and rule above says Met. You have until ${new Date(pr.submit_by).toLocaleDateString()} (day 97) to send it.</p>`;
    return denied + `<form id="pkf"><p style="margin:6px 0">Every goal is met, so you can get back <b>${money(pr.refund_amount)}</b> (the ${money(pr.price)} you paid minus the ${money(pr.fees)} in referral fees${Number(pr.bonuses) > 0 ? ` and ${money(pr.bonuses)} in recruiting bonuses` : ""} you've received). Attach your proof: call-history screenshots, signed agreements or 20% texts, weekly comment screenshots and lead handoff texts. Each screenshot can prove only one thing.</p>
      <label>Anything the reviewer should know?</label><textarea name="note" rows="3"></textarea>
      <label>Evidence files</label><input name="files" type="file" multiple accept="image/*,.pdf">
      <div class="err" id="pkerr"></div>
      <div class="row" style="justify-content:flex-end"><button class="btn" id="pksend">Submit refund package</button></div></form>`;
  };
  app.innerHTML = `<div style="max-width:980px">
    <div class="card" style="margin-bottom:12px"><div class="row"><h2 style="font-size:20px;margin:0;margin-right:auto">Day ${day} of 90</h2>
      <span class="muted">Started ${new Date(pr.paid_at).toLocaleDateString()} · refund package due by ${new Date(pr.submit_by).toLocaleDateString()}</span></div>
      <div class="bar"><i style="width:${(day / 90) * 100}%"></i></div>
      <p style="margin:10px 0 0;font-size:14px">Hit every goal below by its day. If your referral fees${pr.bonuses_count === false ? "" : " and recruiting bonuses"} haven't paid back your ${money(pr.price ?? C.PRICE)} by day 90, you can send one package and get back the difference. Only what you log here on the day you do it counts, so log each contractor, call and lead as it happens. ${pr.bonuses_count === false ? "Bringing in friends is never required, and bonuses never reduce your refund." : "Bringing in friends is never required, but under the Terms you accepted any $250 bonus you're paid by day 90 counts toward paying you back."}</p></div>
    ${s0.progress !== "Approved" ? `<div class="card" id="nichecard" style="margin-bottom:12px"><b>Step 0: your 15 business models</b>
      ${s0.progress === "Waiting for review" ? `<p class="muted" style="margin:6px 0 0">Sent. Waiting for Alex or a verifier to approve it.</p>`
      : `<p style="margin:6px 0">List 15 different, non-overlapping business models in your niche, one per line. Due day 3 (${onDay(pr.paid_at, 3)}).</p>
        ${pr.niche_note ? `<p class="err">Sent back: ${esc(pr.niche_note)}</p>` : ""}
        <textarea id="niche" rows="8" placeholder="Kitchen remodels&#10;Roof repair&#10;…">${esc(pr.niche || "")}</textarea><div class="err" id="nerr"></div>
        <div class="row" style="justify-content:flex-end"><button class="btn" id="nsend">Send my 15</button></div>`}</div>` : ""}
    <div class="card row" id="comcard" style="margin-bottom:12px"><span style="margin-right:auto"><b>Neighbor comments today: ${pr.comments_today}</b> / 50
      <br><small class="muted">50 a day on 5 days of every week, from day 7 to day 90. Log them the same day.</small></span>
      <input id="comn" type="number" min="1" max="1000" placeholder="How many" style="width:120px"><button class="btn" id="comadd">Log comments</button>
      <div class="err" id="comerr" style="width:100%"></div></div>
    <div class="card" id="progcard" style="margin-bottom:12px">${progressTable(pr)}</div>
    <div class="card" id="pkcard"><b>Refund package</b>${packageCard()}
      <p class="muted" style="font-size:13px;margin:10px 0 6px">Your CRM records, as the reviewer will see them:</p><div class="row">${evidenceButtons("me")}</div>
      <p class="muted" style="font-size:13px;margin:10px 0 0">One fake or edited item voids the refund for good.</p></div></div>`;
  wireEvidence(null, "my");
  if ($("#nsend")) $("#nsend").onclick = async () => {
    const { error } = await sb.rpc("submit_niche", { p_list: $("#niche").value });
    if (error) return ($("#nerr").textContent = error.message);
    program();
  };
  $("#comadd").onclick = async () => {
    const n = +$("#comn").value;
    if (!(n >= 1)) return ($("#comerr").textContent = "Enter how many comments you posted today.");
    const { error } = await sb.from("activities").insert({ farmer_id: me.id, kind: "comments", count: n });
    if (error) return ($("#comerr").textContent = error.message);
    program();
  };
  if ($("#pkf")) $("#pkf").onsubmit = async (e) => {
    e.preventDefault();
    $("#pksend").disabled = true;
    const paths = [];
    for (const f of e.target.files.files) {
      const path = `${me.id}/refund-${Date.now()}-${f.name.replace(/[^\w.-]+/g, "_")}`;
      const { error } = await sb.storage.from("proof").upload(path, f);
      if (error) { $("#pksend").disabled = false; return ($("#pkerr").textContent = `Couldn't upload ${f.name}: ${error.message}`); }
      paths.push(path);
    }
    const { error } = await sb.rpc("submit_refund_package", { p_note: new FormData(e.target).get("note"), p_files: paths });
    if (error) { $("#pksend").disabled = false; return ($("#pkerr").textContent = error.message); }
    program();
  };
}

// Calls logged on a contractor (opened from the contractor dialog)
async function callLog(c) {
  const box = $("#calls");
  if (!box) return;
  const { data: calls } = await sb.from("activities").select("*").eq("contractor_id", c.id).eq("kind", "call").order("created_at", { ascending: false });
  box.innerHTML = `<h4 style="margin:16px 0 4px">Calls</h4>

      || `<p class="muted" style="font-size:14px;margin:0">No calls logged yet.</p>`}
    <div class="row" style="margin-top:8px"><select id="cout" style="width:auto">${["no answer", "call back", "not interested", "agreed"].map((o) => `<option>${o}</option>`).join("")}</select>
      <label style="margin:0;display:flex;gap:6px;align-items:center"><input type="checkbox" id="ctxt" style="width:auto"> Sent the 20% text</label>
      <button type="button" class="btn sm" id="clog">Log a call</button></div><div class="err" id="callerr"></div>`;
  box.querySelectorAll("[data-txt]").forEach((b) => b.onclick = async () => {
    const { error } = await sb.from("activities").update({ text_sent: true }).eq("id", b.dataset.txt);
    if (error) return ($("#callerr").textContent = error.message);
    callLog(c);
  });
  $("#clog").onclick = async () => {
    const outcome = $("#cout").value;
    const { error } = await sb.from("activities").insert({ farmer_id: me.id, contractor_id: c.id, kind: "call", outcome, text_sent: $("#ctxt").checked });
    if (error) return ($("#callerr").textContent = error.message);

    const target = outcome === "agreed" ? 3 : 2;
    if (c.stage < target) { await sb.from("contractors").update({ stage: target }).eq("id", c.id); c.stage = target; }
    callLog(c);
  };
}

}

// ---------- farmer: Home extras (alerts, Today list, referrals) ----------
const ago = (t) => (Date.now() - new Date(t).getTime()) / DAY;
const payoutLabel = (r) => r.status === "pending" ? "Waiting on their enrollment" : r.status === "owed" ? "$250 owed to you"
  : r.status === "void" ? "Cancelled (they were refunded)"
  : r.clawback_at ? (r.clawback_settled_at ? "Clawed back" : "Being clawed back (they were refunded)") : "$250 paid";

// The step a farmer is working on: the first one not met whose deadline hasn't passed
const curStep = (pr) => pr?.enrolled ? pr.steps.find((x) => !x.met && x.deadline >= pr.day) : undefined;

// Follow-ups worked out from the farmer's own records; each opens the thing to do
async function todayList(cs) {
  const mine = cs.filter((c) => c.farmer_id === me.id);
  const [{ data: calls }, { data: ls }, { data: pr }] = await Promise.all([
    sb.from("activities").select("*").eq("farmer_id", me.id).eq("kind", "call"),
    lvl() >= 2 ? sb.from("leads").select("*").eq("farmer_id", me.id) : Promise.resolve({ data: [] }),
    sb.rpc("refund_progress"),
  ]);
  const byC = {};
  for (const a of calls || []) (byC[a.contractor_id] ||= []).push(a);
  for (const k in byC) byC[k].sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  const items = [];
  for (const c of mine) {
    const cl = byC[c.id] || [], lastCall = cl[0];
    if (lastCall?.outcome === "call back" && ago(lastCall.created_at) >= 2) items.push({ c, text: `Call ${c.business_name} back. They asked you to on ${new Date(lastCall.created_at).toLocaleDateString()}.` });
    else if (cl.some((a) => a.outcome === "agreed") && !cl.some((a) => a.text_sent)) items.push({ c, text: `Send ${c.business_name} the 20% text. They said yes.` });
    else if (c.stage === 2 && ago(lastCall?.created_at || c.updated_at) >= 3) items.push({ c, text: `Follow up with ${c.business_name}. No call logged in 3 days.` });
  }
  const cname = (id) => cs.find((c) => c.id === id)?.business_name || "the contractor";
  for (const l of ls || []) {
    if (l.direction === "outbound" && ["new", "sent"].includes(l.status) && ago(l.created_at) >= 7) items.push({ l, text: `Check on the lead you sent ${cname(l.contractor_id)}${l.customer_name ? ` for ${l.customer_name}` : ""}. Did it close?` });
    if (l.status === "closed" && !l.fee_paid && ago(l.closed_at || l.created_at) >= 14) items.push({ l, text: `Collect your ${money(l.fee_amount)} fee from ${cname(l.contractor_id)}. The job closed over 2 weeks ago.` });
  }
  // directions only for the step they're on; later steps that have started only show as "behind" on Home
  const cur = curStep(pr);
  if (cur?.n === 4 && pr.day >= 7 && pr.day <= 90 && pr.comments_today < 50) items.push({ go: "program", text: `Post your neighbor comments. ${pr.comments_today} of 50 logged today.` });
  for (const s of cur ? [cur] : []) if (s.deadline - pr.day <= 3)
    items.push({ go: "program", text: `${s.name} is due ${s.deadline === pr.day ? "today" : "in " + (s.deadline - pr.day) + " day" + (s.deadline - pr.day > 1 ? "s" : "")}: ${s.progress}.` });
  return { items, ls: ls || [], pr };
}

// One greeting per visit, in turn, from the lines Alex keeps in the Welcome tab
const greetingFrom = (lines) => {
  if (!me.tour_level && !reviewer()) return `Welcome, ${firstName()}.`;  // first visit
  if (!lines?.length) return `Welcome back, ${firstName()}.`;
  const key = "lf-greet-" + me.id;
  let i = 0;
  try { i = (+(localStorage.getItem(key) ?? -1) + 1) % lines.length; localStorage.setItem(key, i); } catch { i = Math.floor(Math.random() * lines.length); }
  return lines[i].body.replaceAll("{name}", firstName());
};
const firstName = () => (me.full_name || "").trim().split(/\s+/)[0] || "farmer";

// What to do right now, in order of what unblocks the most
function nextStep({ L, aced, ready, pending }, pr, items) {
  const s0 = pr?.enrolled && pr.steps[0];
  if (s0 && !s0.met && pr.day <= 3 && !["Approved", "Waiting for review"].includes(s0.progress))
    return { text: "Send in your 15 business models. They're due on day 3.", go: "program", btn: "Open 90 days" };
  if (L < 3 && !aced) return { text: `Go through your Level ${L} lessons and ace the quiz. It shows you exactly what to do next.`, go: "learn", btn: "Open lessons" };
  if (L < 3 && ready && !pending) return { text: `You've reached the Level ${L + 1} goal. Send your proof and ask to move up.`, go: "next", btn: "Request it" };
  if (pending) return { text: `Your Level ${L + 1} request is with Alex. Keep logging your work while you wait.`, go: items[0] ? "todo" : "program", btn: items[0] ? "Start" : "Open 90 days" };
  const open = curStep(pr);
  if (items[0]) return { text: items[0].text, go: "todo", btn: "Do it" };
  if (open) return { text: `Keep working on step ${open.n}, ${open.name}: ${open.quota}. You're at ${open.progress}.`, go: "program", btn: "Open 90 days" };
  return { text: "Log today's work so your streak stays alive.", go: "program", btn: "Open 90 days" };
}

let tour = null;
async function startTour(kind) {
  const steps = tourSteps(kind).filter((x) => !(x.view === "program" && !(me.role !== "admin" && me.enrollment_paid)));
  if (!steps.length) return markToured();
  tour = { steps, i: 0, kind };
  document.body.insertAdjacentHTML("beforeend", `<div class="tour-block"></div>`);
  addEventListener("keydown", tourKey); addEventListener("resize", tourPlace);
  await tourGo(0);
}
function tourKey(e) { if (e.key === "Escape") endTour(); else if (e.key === "ArrowRight") tourGo(tour.i + 1); else if (e.key === "ArrowLeft" && tour.i > 0) tourGo(tour.i - 1); }
async function markToured() {
  if ((me.tour_level || 0) >= lvl()) return;
  me.tour_level = lvl();
  await sb.from("profiles").update({ tour_level: me.tour_level }).eq("id", me.id);
}
function tourClear() {
  document.querySelectorAll(".tour-hole,.tour-shade,.tour-card").forEach((e) => e.remove());
}
function endTour(go) {
  if (!tour) return;
  tourClear(); document.querySelectorAll(".tour-block,.tour-ghost").forEach((e) => e.remove());
  if (dlg.open) dlg.close();
  removeEventListener("keydown", tourKey); removeEventListener("resize", tourPlace);
  tour = null; markToured();
  view = go || "home"; boot();
}
const tourWait = async (sel) => { for (let k = 0; k < 40; k++) { const el = $(sel); if (el) return el; await new Promise((r) => setTimeout(r, 75)); } return null; };
async function tourGo(i) {
  if (!tour) return;
  if (i >= tour.steps.length) return endTour();
  const s = tour.steps[i]; tour.i = i;
  tourClear();
  if (dlg.open) dlg.close();
  if (s.view !== view || !app.children.length) { view = s.view; await boot(); }
  if (!tour) return;
  if (s.ghosts && !$('[data-ghost]')) {
    const set = $('#nav [data-v="settings"]'), lock = `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>`;
    for (const [k, label, lv] of [["money", "Money", 2]])
      set.insertAdjacentHTML("beforebegin", `<button class="tour-ghost" data-ghost="${k}" tabindex="-1">${lock}<span>${label}</span><span class="lk">Lv ${lv}</span></button>`);
  }
  if (!s.ghosts) document.querySelectorAll(".tour-ghost").forEach((e) => e.remove());
  if (s.open === "add") contractorForm();
  if (s.open === "lead") leadForm({}, await myContractors());
  if (s.open === "sample") {
    // an example contractor, drawn locally and never saved, so a farmer with no contractors still sees the call log
    contractorForm();
    const f = $("#cf");
    f.querySelector("h3").textContent = "Example: Rivera Plumbing";

  host.append(card);

    if (t === "next") { tour.dir = 1; s.done ? endTour(lvl() === 1 ? "program" : "home") : tourGo(tour.i + 1); }
    if (t === "alt") s.done ? endTour("home") : endTour();

  const hole = document.createElement("div"); hole.className = "tour-hole"; host.append(hole);
  tour.hole = hole;
  const phone = innerWidth <= 640;
  el.scrollIntoView({ block: phone ? "start" : "center", inline: "center" });

function tourPlace() {
  if (!tour?.el || !tour.hole) return;
  const { el, card, hole } = tour, pad = 8;
  let r = el.getBoundingClientRect();
  const cw = card.offsetWidth, ch = card.offsetHeight, vw = innerWidth, vh = innerHeight, phone = vw <= 640;
  const right = (q) => q.right + pad + 24 + cw < vw, below = (q) => q.bottom + pad + 22 + ch < vh, above = (q) => q.top - pad - 22 - ch > 0;
  if (!phone && !dlg.open && !right(r) && !below(r) && !above(r)) {
    // make room underneath; a section taller than that gets only its top part lit up
    scrollBy(0, r.top - 24); const q = el.getBoundingClientRect();
    r = { left: q.left, right: q.right, width: q.width, top: q.top, bottom: Math.min(q.bottom, vh - ch - 40) };
    r.height = r.bottom - r.top;
  }
  Object.assign(hole.style, { left: r.left - pad + "px", top: r.top - pad + "px", width: r.width + pad * 2 + "px", height: r.height + pad * 2 + "px" });
  card.querySelector(".tc-arrow")?.remove();
  if (phone) return Object.assign(card.style, { left: "", top: "" });
  const mid = (a, size, lim) => Math.min(Math.max(12, a - size / 2), lim - size - 12);
  let x, y, side;
  if (right(r)) { x = r.right + pad + 22; y = mid(r.top + r.height / 2, ch, vh); side = "left"; }
  else if (below(r)) { x = mid(r.left + r.width / 2, cw, vw); y = r.bottom + pad + 20; side = "top"; }
  else if (above(r)) { x = mid(r.left + r.width / 2, cw, vw); y = r.top - pad - 20 - ch; side = "bottom"; }
  else { x = Math.max(12, r.left - pad - 22 - cw); y = mid(r.top + 40, ch, vh); side = "right"; }
  Object.assign(card.style, { left: x + "px", top: y + "px" });
  const a = document.createElement("span"); a.className = "tc-arrow";
  const ax = Math.min(cw - 30, Math.max(14, r.left + r.width / 2 - x - 8)), ay = Math.min(ch - 30, Math.max(14, r.top + r.height / 2 - y - 8));
  Object.assign(a.style, side === "left" ? { left: "-9px", top: ay + "px", transform: "rotate(-45deg)" } : side === "top" ? { top: "-9px", left: ax + "px" }
    : side === "bottom" ? { bottom: "-9px", left: ax + "px", transform: "rotate(225deg)" } : { right: "-9px", top: "24px", transform: "rotate(135deg)" });
  card.append(a);
}

async function moneyView() {

    const d = new Date(l.closed_at || l.created_at), k = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
    const m = (months[k] ||= { paid: 0, owed: 0, jobs: 0 });

  }
  const keys = Object.keys(months).sort().reverse();

  const owed = closed.filter((l) => !l.fee_paid).sort((a, b) => new Date(a.closed_at || a.created_at) - new Date(b.closed_at || b.created_at));

        <td style="width:50%"><div class="bar money"><i style="width:${(m.paid / top) * 100}%"></i><i class="owed" style="width:${(m.owed / top) * 100}%"></i></div></td>
        <td style="white-space:nowrap">${money(m.paid)} collected${m.owed ? ` · ${money(m.owed)} owed` : ""}<br><small class="muted">${m.jobs} job${m.jobs > 1 ? "s" : ""}</small></td></tr>`; }).join("")}</tbody></table>`
      : `<p class="muted" style="margin:6px 0 0">Fees show up here once a lead you sent closes.</p>`}</div>
    <div class="card" style="margin-bottom:12px" id="owedlist"><b>Who still owes you</b>
      ${owed.length ? `<table style="margin-top:6px"><tbody>${owed.map((l) => `<tr><td><b>${esc(cname(l.contractor_id))}</b><br><small class="muted">${esc(l.customer_name || l.job_description || "")} · closed ${new Date(l.closed_at || l.created_at).toLocaleDateString()}</small></td>
        <td>${money(l.fee_amount)}</td><td style="text-align:right"><button class="btn sm" data-feepaid="${l.id}">Paid</button></td></tr>`).join("")}</tbody></table>`
      : `<p class="muted" style="margin:6px 0 0">Nobody owes you right now.</p>`}<div class="err" id="moneyerr"></div></div>
    ${lvl() >= 3 ? `<div class="card" id="upsellmoney"><b>Upsells</b>
      ${(us || []).length ? `<table style="margin-top:6px"><tbody>${us.map((u) => `<tr><td>${esc(cname(u.contractor_id))}</td><td>${esc(u.product)}</td><td><span class="tag">${esc(u.status)}</span></td><td>${u.amount != null ? money(u.amount) : ""}</td></tr>`).join("")}</tbody></table>`
      : `<p class="muted" style="margin:6px 0 0">No upsells yet. Log pitches in the Upsells tab.</p>`}</div>` : ""}</div>`;
  app.querySelectorAll("[data-feepaid]").forEach((b) => b.onclick = async () => {

let learnQuiz = null;
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const doneKey = () => "lf-done-" + me.id;
const doneSet = () => { try { return new Set(JSON.parse(localStorage.getItem(doneKey()) || "[]")); } catch { return new Set(); } };

// lesson pictures are drawn by curriculum/diagrams.js (plain script, global DIAGRAMS)
const svgOf = (d) => { try { return DIAGRAMS[d.diagram](); } catch { return ""; } };

  { name: "Find your contractors", sub: "Map your area and spot the hungry ones", ids: ["1m", "1e"] },

  { name: "Lock in the 20%", sub: "Charge on revenue and keep watch", ids: ["3a", "3b"] },
  { name: "Send your first leads", sub: "Easy jobs, comment like a neighbor, hand off", ids: ["4a", "4b", "4c", "4d"] },
  { name: "Close it and get paid", sub: "What counts as closed and how to collect", ids: ["5a", "5b", "5c"] },
  { name: "Get leads back", sub: "Pry leads out of your contractors", ids: ["6a", "6b"] },
  { name: "Grow your anchors", sub: "One steady contractor in every industry", ids: ["7a"] },
  { name: "Sell the upsell", sub: "Pick it, pitch it, and close it in writing", ids: ["8a", "8b", "9a"] },
  { name: "Late game", sub: "Run jobs yourself once you have anchors", ids: ["mm"] },

}, []);

let nichePick = 0;
// One card at a time, then a practice question
function lessonView(list, li, step = 0) {
  const l = list[li], d = l.data, n = d.cards.length;
  const map = d.diagram === "territory" && typeof TERRITORY_NICHES !== "undefined"; // the map builds up card by card; tap a niche to light it in every town
  const back = `<button class="btn ghost sm" id="lback">← All lessons</button>`;
  if (step < n) {
    app.innerHTML = `<div class="player">${back}<div class="bar"><i style="width:${(step / (n + 1)) * 100}%"></i></div>
      <div class="card"><div class="ldiagram">${map ? DIAGRAMS.territory(nichePick, Math.min(step + 1, 4)) : svgOf(d)}</div>
      ${map && step >= 3 ? `<div class="nichepick" role="group" aria-label="Find a niche in every town">${TERRITORY_NICHES.map((x, i) => `<button class="chipbtn ${i === nichePick ? "on" : ""}" data-n="${i}" aria-pressed="${i === nichePick}">${esc(x)}</button>`).join("")}</div>` : ""}
      <small class="muted">${esc(d.step)} · ${esc(d.title)}</small>
      ${step === 0 ? `<p class="metaphor">${esc(d.metaphor)}</p>` : ""}<p class="lcard">${esc(d.cards[step])}</p>
      <div class="row" style="justify-content:space-between"><span class="muted" style="font-size:13px">${step + 1} of ${n}</span>
      <span class="row">${step ? `<button class="btn ghost" id="lprev">Back</button>` : ""}<button class="btn" id="lnext">Next</button></span></div></div></div>`;
    $("#lnext").onclick = () => lessonView(list, li, step + 1);
    app.querySelectorAll("[data-n]").forEach((b) => b.onclick = () => { nichePick = +b.dataset.n; lessonView(list, li, step); });
    if ($("#lprev")) $("#lprev").onclick = () => lessonView(list, li, step - 1);
  } else {
    const c = d.check;
    app.innerHTML = `<div class="player">${back}<div class="bar"><i style="width:${(n / (n + 1)) * 100}%"></i></div>
      <div class="card"><small class="muted">Practice</small><p class="lcard"><b>${esc(c.q)}</b></p>
      <div class="opts">${c.o.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}</div>
      <p id="fb" class="muted" style="min-height:1.4em"></p>
      <div class="row" style="justify-content:flex-end"><button class="btn ghost" id="lprev">Back</button><button class="btn" id="lfin" hidden>${li + 1 < list.length ? "Next lesson" : "Finish"}</button></div></div></div>`;
    app.querySelectorAll(".opt").forEach((b) => b.onclick = () => {
      app.querySelectorAll(".opt").forEach((x) => x.classList.remove("right", "wrong"));
      const ok = +b.dataset.i === c.a;
      b.classList.add(ok ? "right" : "wrong");
      $("#fb").textContent = ok ? "Nice. That's it." : "Not quite. Try again.";
      if (ok) { markDone(l.id); $("#lfin").hidden = false; }
    });
    $("#lprev").onclick = () => lessonView(list, li, n - 1);
    $("#lfin").onclick = () => li + 1 < list.length ? lessonView(list, li + 1) : learn();
  }
  $("#lback").onclick = () => learn();
  window.scrollTo(0, 0);
}

// The quiz: shuffled questions and answers; graded by the database; misses point back to lessons
function quizView(Z, qq, mine) {
  const qs = shuffle(qq).map((x) => ({ ...x, order: shuffle(x.options.map((_, i) => i)) }));
  const answers = [];
  const show = (i) => {
    if (i >= qs.length) return submit();
    const x = qs[i];
    app.innerHTML = `<div class="player"><button class="btn ghost sm" id="qquit">Quit</button>
      <div class="bar"><i style="width:${(i / qs.length) * 100}%"></i></div>
      <div class="card"><small class="muted">${esc(quizLabel(Z))} quiz · question ${i + 1} of ${qs.length}</small>
      <p class="lcard"><b>${esc(x.q)}</b></p>
      <div class="opts">${x.order.map((oi) => `<button class="opt" data-i="${oi}">${esc(x.options[oi])}</button>`).join("")}</div></div></div>`;
    app.querySelectorAll(".opt").forEach((b) => b.onclick = () => { answers[x.idx] = +b.dataset.i; show(i + 1); });
    $("#qquit").onclick = () => learn();
  };
  const submit = async () => {
    app.innerHTML = `<div class="player"><div class="card muted">Checking your answers…</div></div>`;
    const full = qq.map((x) => answers[x.idx] ?? -1);
    const { data: r, error } = await sb.rpc("submit_quiz", { p_quiz: Z.key, p_answers: full });
    if (error) return (app.innerHTML = `<div class="player"><div class="card"><p class="err">${esc(error.message)}</p><button class="btn" id="qback">Back</button></div></div>`, $("#qback").onclick = () => learn());
    const review = mine.filter((l) => (r.review || []).includes(l.id));
    app.innerHTML = `<div class="player"><div class="card result ${r.passed ? "pass" : "fail"}">
      <h2 style="margin:0 0 6px">${r.passed ? `🎉 Aced it: ${r.total} of ${r.total}` : `${r.score} of ${r.total}. You need every one.`}</h2>
      <p>${r.passed ? (Z.key === "rec" ? "You can ask a teacher about recruiting now." : "You can ask a teacher about this level now, and request the next level once you've reached its goal and have your proof.")
        : "Review these lessons, then try again:"}</p>
      ${review.map((l) => `<button class="btn ghost sm" data-rl="${l.id}" style="margin:0 6px 6px 0">${esc(l.data.title)}</button>`).join("")}
      <div class="row" style="margin-top:10px"><button class="btn" id="qagain">${r.passed ? "Back to lessons" : "Try again"}</button></div></div></div>`;
    app.querySelectorAll("[data-rl]").forEach((b) => b.onclick = () => lessonView(mine, mine.findIndex((l) => l.id === b.dataset.rl)));
    $("#qagain").onclick = () => r.passed ? learn() : quizView(Z, qq, mine);
  };
  show(0);
}

// ---------- farmer: my farmland (their 15 niches across their towns) ----------
const nicheLines = (p) => (p?.niche || "").split("\n").map((x) => x.replace(/^\s*(\d+[.)]|[-*•])\s*/, "").trim()).filter(Boolean).slice(0, 15);
const norm = (x) => (x || "").trim().toLowerCase();
const MAX_TOWNS = 50;
function farmlandCard(cs) {
  const towns = me.towns || [], ns = nicheLines(me), mine = cs.filter((c) => c.farmer_id === me.id);
  const at = (t, n) => mine.filter((c) => norm(c.city) === norm(t) && norm(c.niche) === norm(n));
  const cov = towns.map((t) => ns.map((n) => { const m = at(t, n); return m.some((c) => c.stage >= 3) ? 2 : m.length ? 1 : 0; }));
  const map = farmlandMap([...Array(Math.max(10, towns.length))].map((_, i) => towns[i] ? { name: towns[i], cov: cov[i] } : null));
  const status = !ns.length ? "" : me.niche_approved_at ? `<span class="tag">approved</span>` : me.niche_note ? `<span class="tag warn">sent back</span>` : me.niche_submitted_at ? `<span class="tag warn">waiting for review</span>` : "";
  const untagged = towns.length && ns.length ? mine.filter((c) => !towns.some((t) => norm(t) === norm(c.city)) || !ns.some((n) => norm(n) === norm(c.niche))).length : 0;
  const cell = (v) => v === 2 ? `<td class="s" title="Signed">●</td>` : v ? `<td class="f" title="Found">○</td>` : `<td class="e" title="Empty">·</td>`;
  return `<section class="card" id="farmland" aria-label="My farmland"><div class="row" style="justify-content:space-between">
      <h2 style="margin:0;font-size:20px">My farmland</h2><div class="row" style="gap:6px">${towns.length && towns.length < MAX_TOWNS ? `<button class="btn ghost sm" id="addtown">+ Add town</button>` : ""}<button class="btn ghost sm" id="editmap">${towns.length ? "Edit my towns" : "Map my farmland"}</button></div></div>
    ${towns.length ? "" : `<p class="muted" style="margin:8px 0 0">Pick a home base and at least 9 more towns within 50 miles of it, and add more any time. Then tag each contractor with its town and one of your 15 niches, and this map shows which spots are filled.</p>`}
    <div class="ldiagram" style="margin:10px 0 0">${map}</div>
    <h3>Your 15 niches ${status}</h3>
    ${ns.length ? `<ol class="nichelist">${ns.map((n, k) => `<li>${esc(n)} <small>${towns.length ? cov.filter((r) => r[k]).length + "/" + towns.length + " towns" : ""}</small></li>`).join("")}</ol>`
      : `<p class="muted" style="margin:0">You haven't sent your 15 yet. <a href="#" id="to90">Send them on the 90 days page</a>.</p>`}
    ${towns.length && ns.length ? `<details><summary>Town by town</summary><div class="tablewrap"><table class="fgrid"><thead><tr><th>Town</th>${ns.map((n, k) => `<th title="${esc(n)}">${k + 1}</th>`).join("")}<th>Filled</th></tr></thead><tbody>
      ${towns.map((t, i) => `<tr><td>${i ? "" : "⌂ "}${esc(t)}</td>${cov[i].map(cell).join("")}<td>${cov[i].filter(Boolean).length}/${ns.length}</td></tr>`).join("")}</tbody></table></div>
      <p class="muted" style="margin:6px 0 0;font-size:13px">● signed (Terms Agreed or later) · ○ found, not signed yet · column numbers match your list above</p></details>` : ""}
    ${untagged ? `<p class="muted" style="margin:10px 0 0;font-size:14px">${untagged} contractor${untagged > 1 ? "s aren't" : " isn't"} on the map yet. Open them on the Contractors page and pick their town and niche.</p>` : ""}</section>`;
}
function farmlandForm(addOne) {
  const t = me.towns || [];
  const row = (i, v) => `<div class="townrow"><label for="town${i}">Town ${i + 1}</label><div class="row" style="gap:6px;flex-wrap:nowrap"><input id="town${i}" class="townin" value="${esc(v)}"><button type="button" class="btn ghost sm rmtown" aria-label="Remove town ${i + 1}">×</button></div></div>`;
  const n0 = Math.min(MAX_TOWNS, Math.max(10, t.length + (addOne ? 1 : 0)));
  dlg.innerHTML = `<form method="dialog" id="ff"><h3 style="margin-top:0">My farmland</h3>
    <p class="muted" style="margin:0 0 10px">Your home base sits in the middle. Add towns or areas within 50 miles of it, as many as you farm (up to ${MAX_TOWNS}).</p>
    <label for="town0">Home base</label><input id="town0" class="townin" value="${esc(t[0] || "")}" placeholder="e.g. Austin, TX">
    <div class="grid2" id="townlist">${[...Array(n0 - 1)].map((_, i) => row(i + 1, t[i + 1] || "")).join("")}</div>
    <button type="button" class="btn ghost sm" id="addrow" style="margin-top:8px">+ Add another town</button>
    <div class="err" id="ferr"></div>
    <div class="row" style="margin-top:12px;justify-content:flex-end"><button type="button" class="btn ghost" id="fcx">Cancel</button><button class="btn">Save</button></div></form>`;
  dlg.showModal();
  const list = $("#townlist"), renum = () => {
    [...list.children].forEach((d, i) => { const k = i + 1; d.querySelector("label").textContent = "Town " + (k + 1); d.querySelector("label").htmlFor = d.querySelector("input").id = "town" + k; d.querySelector(".rmtown").setAttribute("aria-label", "Remove town " + (k + 1)); });
    $("#addrow").hidden = list.children.length + 1 >= MAX_TOWNS;
  };
  const wire = () => list.querySelectorAll(".rmtown").forEach((b) => b.onclick = () => { b.closest(".townrow").remove(); renum(); });
  $("#addrow").onclick = () => { list.insertAdjacentHTML("beforeend", row(list.children.length + 1, "")); wire(); renum(); list.lastElementChild.querySelector("input").focus(); };
  wire(); renum();
  if (addOne) (list.querySelector(`#town${t.length}`) || list.lastElementChild?.querySelector("input"))?.focus();
  $("#fcx").onclick = () => dlg.close();
  $("#ff").onsubmit = async (e) => {
    e.preventDefault();
    const vals = [...dlg.querySelectorAll(".townin")].map((x) => x.value.trim());
    if (!vals[0] && vals.some(Boolean)) return ($("#ferr").textContent = "Add your home base first.");
    const towns = vals.filter(Boolean);
    if (towns.length > MAX_TOWNS) return ($("#ferr").textContent = `You can map up to ${MAX_TOWNS} towns.`);
    if (new Set(towns.map(norm)).size !== towns.length) return ($("#ferr").textContent = "Each town can only be on the list once.");
    const { error } = await sb.from("profiles").update({ towns }).eq("id", me.id);
    if (error) return ($("#ferr").textContent = error.message);
    me.towns = towns; dlg.close(); boot();
  };
}

let cQuery = "";  // kept across re-renders so saving a contractor doesn't clear the search
// everything a farmer might type to find a contractor, lowercased; phone also as bare digits
const contractorHay = (c) => [c.business_name, c.contact_name, c.city, c.niche, tradeName(c.trade_id), c.phone, String(c.phone || "").replace(/\D/g, ""),
  c.email, c.notes, c.found_via, c.source_link, stageName(c.stage)].filter(Boolean).join(" ").toLowerCase();
async function contractors() {
  const cs = await myContractors();
  app.innerHTML = `
    <div class="row" style="margin-bottom:12px"><h2 style="margin:0;margin-right:auto;font-size:18px">Contractors by trade</h2>
      <button class="btn" id="add">Add contractor</button></div>
    <div class="trades">${(me.role === "admin" ? sharedTrades() : myTrades()).map((t) => {
      const n = cs.filter((c) => c.trade_id === t.id && c.stage >= 3).length;
      return `<div class="card" style="padding:10px"><b style="font-size:14px">${esc(t.name)}</b>
        <div class="muted" style="font-size:12px">${n} / ${PER_TRADE} in network</div><div class="bar"><i style="width:${Math.min(100, n / PER_TRADE * 100)}%"></i></div></div>`;
    }).join("") || `<p class="muted">No trades set up yet.</p>`}</div>
    ${cs.length ? `<div class="row" style="margin-bottom:8px;gap:10px"><input id="csearch" type="search" placeholder="Search by name, town, niche, trade, phone, email or notes" aria-label="Search contractors" value="${esc(cQuery)}" style="flex:1;min-width:200px">
      <small class="muted" id="ccount"></small></div>` : ""}
    <div class="card tablewrap"><table><thead><tr><th>Business</th><th>Trade</th><th>Contact</th><th>Stage</th><th>Fee %</th></tr></thead><tbody>
    ${cs.map((c) => `<tr data-id="${c.id}" data-hay="${esc(contractorHay(c))}" style="cursor:pointer"><td><b>${esc(c.business_name)}</b><br><small class="muted">${esc(c.city)}${c.niche ? " · " + esc(c.niche) : ""}</small></td>
      <td>${esc(tradeName(c.trade_id))}</td><td>${esc(c.contact_name)}<br><small class="muted">${esc(c.phone)} ${esc(c.email)}</small></td>
      <td><span class="tag">${c.stage}. ${esc(stageName(c.stage))}</span></td><td>${c.fee_pct ?? ""}</td></tr>`).join("") || `<tr><td colspan="5" class="muted">No contractors yet.</td></tr>`}
    <tr id="cnone" hidden><td colspan="5" class="muted">No contractors match that search.</td></tr>
    </tbody></table></div>`;
  $("#add").onclick = () => contractorForm();
  const rows = [...app.querySelectorAll("tr[data-id]")];
  rows.forEach((el) => el.onclick = () => contractorForm(cs.find((c) => c.id === el.dataset.id)));
  // every word typed has to appear somewhere in the row, in any order ("roof austin" finds roofers in Austin)
  const filter = () => {
    const words = norm(cQuery).split(/\s+/).filter(Boolean);
    let shown = 0;
    for (const r of rows) { const hit = words.every((w) => r.dataset.hay.includes(w)); r.hidden = !hit; shown += hit; }
    $("#cnone").hidden = shown > 0 || !rows.length;
    $("#ccount").textContent = words.length ? `${shown} of ${rows.length}` : `${rows.length} contractor${rows.length === 1 ? "" : "s"}`;
  };
  if ($("#csearch")) { $("#csearch").oninput = (e) => { cQuery = e.target.value; filter(); }; filter(); }
}

      <div><label>Stage</label><select name="stage">${stages.map((s) => `<option value="${s.id}" ${s.id === (c.stage || 1) ? "selected" : ""}>${s.id}. ${esc(s.name)}</option>`).join("")}</select></div>

      <div><label>Town</label><input name="city" list="mytowns" value="${esc(c.city)}"><datalist id="mytowns">${(me.towns || []).map((t) => `<option value="${esc(t)}">`).join("")}</datalist></div>
      <div><label>Niche (one of your 15)</label>${me.role === "admin" ? `<input name="niche" value="${esc(c.niche)}">`

      <div style="grid-column:1/-1"><label>Where you found them (link to the post or profile)</label><input name="source_link" type="url" placeholder="https://" value="${esc(c.source_link)}"></div>
      <div><label>Found via</label><select name="found_via">${["","Facebook","Nextdoor","Local forum","Referral","Other"].map((o) => `<option ${o === c.found_via ? "selected" : ""}>${o}</option>`).join("")}</select></div>
      <div><label>Referral fee %</label><input name="fee_pct" type="number" min="0" max="100" step="0.5" value="${c.fee_pct ?? 20}"></div>
    </div>
    <label>Notes</label><textarea name="notes" rows="3">${esc(c.notes)}</textarea>
    ${c.id ? `<div id="calls"></div>` : ""}
    <div class="err" id="cerr"></div>
    <div class="row" style="margin-top:12px;justify-content:flex-end">
      ${c.id ? `<button type="button" class="btn ghost" id="del" style="margin-right:auto">Delete</button>` : ""}
      <button type="button" class="btn ghost" id="cx">Cancel</button><button class="btn">Save</button></div></form>`;
  dlg.showModal();
  if (c.id) callLog(c);
  $("#cx").onclick = () => dlg.close();
  // picking a trade fills in the matching niche from their 15, if one matches and none is picked yet
  $('#cf [name="trade_id"]').onchange = async (e) => {
    if (e.target.value === "new") {
      const name = prompt("Name your new trade, e.g. Pool cleaning. It's only added to your list.");
      if (!name?.trim()) return (e.target.value = c.trade_id || "");
      const { data, error } = await addOwnTrade(name);
      if (error) { $("#cerr").textContent = error; return (e.target.value = c.trade_id || ""); }
      e.target.querySelector('option[value="new"]').insertAdjacentHTML("beforebegin", `<option value="${data.id}">${esc(data.name)}</option>`);
      e.target.value = data.id;
    }
    const sel = $('#cf select[name="niche"]'), tn = norm(tradeName(+e.target.value));
    if (!sel || sel.value || !tn) return;
    const hit = [...sel.options].find((o) => o.value && (norm(o.value) === tn || norm(o.value).includes(tn) || tn.includes(norm(o.value))));
    if (hit) sel.value = hit.value;
  };
  if (c.id) $("#del").onclick = async () => {
    if (!confirm("Delete this contractor and its history?")) return;
    await sb.from("contractors").delete().eq("id", c.id); dlg.close(); boot();
  };
  $("#cf").onsubmit = async (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    const row = { ...f, trade_id: f.trade_id ? +f.trade_id : null, stage: +f.stage, fee_pct: f.fee_pct === "" ? null : +f.fee_pct, niche: f.niche || null };
    const { error } = c.id
      ? await sb.from("contractors").update(row).eq("id", c.id)
      : await sb.from("contractors").insert({ ...row, farmer_id: me.id });
    if (error) return ($("#cerr").textContent = error.message);
    dlg.close(); boot();
  };
}

function leadForm(l = {}, cs) {
  dlg.innerHTML = `<form id="lf">
    <h3 style="margin-top:0">${l.id ? "Edit lead" : "Log a lead"}</h3>
    <div class="grid2">
      <div><label>Direction</label><select name="direction"><option value="outbound" ${l.direction !== "inbound" ? "selected" : ""}>I sent it to a contractor</option><option value="inbound" ${l.direction === "inbound" ? "selected" : ""}>A contractor sent it to me</option></select></div>
      <div><label>Source</label><select name="source">${["Nextdoor","Facebook","Local forum","Contractor referral","Other"].map((o) => `<option ${o === l.source ? "selected" : ""}>${o}</option>`).join("")}</select></div>
    </div>
    <label>Contractor</label><select name="contractor_id"><option value="">—</option>${cs.map((c) => `<option value="${c.id}" ${c.id === l.contractor_id ? "selected" : ""}>${esc(c.business_name)} (${esc(tradeName(c.trade_id))})</option>`).join("")}</select>
    <label>Customer name</label><input name="customer_name" value="${esc(l.customer_name)}">
    <label>Job description</label><textarea name="job_description" rows="2">${esc(l.job_description)}</textarea>
    <div class="grid2">
      <div><label>Status</label><select name="status">${["new","sent","closed","lost"].map((o) => `<option ${o === (l.status || "sent") ? "selected" : ""}>${o}</option>`).join("")}</select></div>
      <div><label>Job value ($)</label><input name="job_value" type="number" step="0.01" value="${l.job_value ?? ""}"></div>
      <div><label>Fee %</label><input name="fee_pct" type="number" step="0.5" value="${l.fee_pct ?? ""}" placeholder="defaults to contractor's %"></div>
      <div><label>Fee paid?</label><select name="fee_paid"><option value="false">No</option><option value="true" ${l.fee_paid ? "selected" : ""}>Yes</option></select></div>
    </div>
    <div class="err" id="lerr"></div>
    <div class="row" style="margin-top:12px;justify-content:flex-end"><button type="button" class="btn ghost" id="cx">Cancel</button><button class="btn">Save</button></div></form>`;
  dlg.showModal();
  $("#cx").onclick = () => dlg.close();
  $("#lf").onsubmit = async (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    const con = cs.find((c) => c.id === f.contractor_id);
    const row = { ...f, contractor_id: f.contractor_id || null,
      job_value: f.job_value === "" ? null : +f.job_value,
      fee_pct: f.fee_pct === "" ? (con?.fee_pct ?? null) : +f.fee_pct,
      fee_paid: f.fee_paid === "true",
      closed_at: f.status === "closed" ? (l.closed_at || new Date().toISOString()) : null };
    const { error } = l.id
      ? await sb.from("leads").update(row).eq("id", l.id)
      : await sb.from("leads").insert({ ...row, farmer_id: me.id });
    if (error) return ($("#lerr").textContent = error.message);
    // First outbound lead / first close nudges the contractor's stage forward
    if (con && row.direction === "outbound") {
      const target = row.status === "closed" && row.fee_paid ? 5 : 4;
      if (con.stage < target && con.stage >= 3) await sb.from("contractors").update({ stage: target }).eq("id", con.id);
    }
    if (con && row.direction === "inbound" && con.stage >= 5 && con.stage < 6) await sb.from("contractors").update({ stage: 6 }).eq("id", con.id);
    dlg.close(); boot();
  };
}

  app.querySelectorAll("[data-wedit]").forEach((b) => b.onclick = async () => {
    const l = lines.find((x) => x.id === +b.dataset.wedit), body = prompt("Edit the greeting ({name} = their first name)", l.body);
    if (body && body.trim() !== l.body) done(await sb.from("welcome_lines").update({ body: body.trim() }).eq("id", l.id));
  });
}

async function tradesView() {
  const shared = sharedTrades(), own = trades.filter((t) => t.farmer_id);
  const admin = me.role === "admin";
  const names = admin && own.length ? Object.fromEntries(((await sb.from("profiles").select("id,full_name")).data || []).map((p) => [p.id, p.full_name])) : {};
  const del = (t) => `<button class="btn ghost sm" data-del="${t.id}">Remove</button>`;
  app.innerHTML = `<div class="card" style="max-width:560px"><h2 style="margin-top:0;font-size:18px">Trades in the niche</h2>
    <p class="muted">${admin ? `Every farmer works toward ${PER_TRADE} contractors per trade on this shared list. Farmers can also add their own trades, which only they see.`
      : `Everyone works from this shared list. If you scout a kind of contractor that isn't on it, add it below as your own trade. Only you see your own trades, and you can file contractors under them.`}</p>
    <table><tbody>${shared.map((t) => `<tr><td>${esc(t.name)}</td><td style="text-align:right">${admin ? del(t) : ""}</td></tr>`).join("")}</tbody></table>
    ${admin ? `<form id="tf" class="row" style="margin-top:12px"><input name="name" placeholder="Add a shared trade, e.g. Roofing" required style="flex:1"><button class="btn">Add</button></form>` : ""}
    <h3 style="margin:18px 0 6px;font-size:16px">${admin ? "Trades farmers added" : "Your own trades"}</h3>
    ${own.length ? `<table><tbody>${own.map((t) => `<tr><td>${esc(t.name)}${admin ? ` <small class="muted">· ${esc(names[t.farmer_id] || "a farmer")}</small>` : ""}</td><td style="text-align:right">${del(t)}</td></tr>`).join("")}</tbody></table>`
      : `<p class="muted" style="margin:0">${admin ? "None yet." : "None yet. Add one here, or pick “+ Add my own trade…” in the Trade box when you add a contractor."}</p>`}
    ${admin ? "" : `<form id="tf" class="row" style="margin-top:12px"><input name="name" placeholder="Add your own trade, e.g. Pool cleaning" required maxlength="60" style="flex:1"><button class="btn">Add</button></form>`}
    <div class="err" id="terr"></div></div>`;
  $("#tf").onsubmit = async (e) => {
    e.preventDefault();
    const name = new FormData(e.target).get("name").trim();
    if (!admin) {
      const { error } = await addOwnTrade(name);
      if (error) return ($("#terr").textContent = error);
      return boot();
    }
    const { error } = await sb.from("trades").insert({ name, sort_order: shared.length });
    if (error) return ($("#terr").textContent = error.message);
    await loadRef(); boot();
  };
  app.querySelectorAll("[data-del]").forEach((b) => b.onclick = async () => {
    const { error } = await sb.from("trades").delete().eq("id", +b.dataset.del);
    if (error) return ($("#terr").textContent = "Can't remove a trade that contractors are filed under.");
    await loadRef(); boot();
  });
}
</script>
</body>
</html>
