<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Farmer CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="curriculum/diagrams.js"></script>
<style>
:root{--leaf:#3E7B3A;--leaf2:#72AA5C;--soil:#7E5A3B;--soil2:#B48A5E;--trunk:#6A4A2E;--onsoil:#FFF5E4;--sky:#DDEBF1;--sky2:#4F8AB0;--meadow:#DCEBC8;--gold:#F0B93A;--gold-d:#A9760F;--bloom:#D3648A;--apple:#C9473B;--bad:#B83E33;--good:#2C7F45;--skin:#E5B68C;--paper:#FFFFFF;--rock:#9AA095;--bg:#f6f7f4;--card:#fff;--ink:#1d2420;--muted:#66706a;--line:#e2e5df;--accent:#2f6b3f;--accent-ink:#fff;--warn:#a5521b;--soft:#eaf2ec}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--leaf:#5FA552;--leaf2:#3F7A36;--soil:#4E3824;--soil2:#7A5B3B;--trunk:#8C6A47;--onsoil:#F3E7D3;--sky:#1C2D35;--sky2:#6EA8CC;--meadow:#1F2E1B;--gold:#F2C24E;--gold-d:#E6AE3A;--bloom:#E07FA0;--apple:#E06A5C;--bad:#E46B5E;--good:#5DC27B;--skin:#D2A07A;--paper:#263027;--rock:#5E655A;--bg:#121512;--card:#1b201c;--ink:#e7ebe7;--muted:#9aa49d;--line:#2c332d;--accent:#5fae73;--accent-ink:#0d130f;--warn:#e19a62;--soft:#1f2a22}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header[hidden]{display:none}
a{color:var(--accent)}
header h1{font-size:16px;margin:0;margin-right:auto}
nav button{background:none;border:0;color:var(--muted);font:inherit;padding:6px 10px;border-radius:6px;cursor:pointer}
nav button.on{background:var(--soft);color:var(--accent);font-weight:600}
main{padding:20px;max-width:1400px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:7px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:4px 9px;font-size:13px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.muted{color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
.tablewrap{overflow-x:auto}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:200px}
.col h3{font-size:13px;margin:0 0 2px}
.col .n{font-size:12px;color:var(--muted);margin-bottom:8px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;cursor:pointer}
.chip b{display:block;font-size:14px}
.chip small{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.stat .v{font-size:24px;font-weight:700}
.stat .k{font-size:12px;color:var(--muted)}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;background:var(--soft);color:var(--accent)}
.tag.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:min(560px,94vw);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.4)}
.auth{max-width:380px;margin:8vh auto}
.banner{max-width:1400px;margin:16px auto 0;padding:0 20px}.banner .card{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-color:var(--accent)}
.err{color:var(--warn);font-size:14px;min-height:1.2em;margin-top:8px}
.trades{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-bottom:16px}
.lockedcol,.lvl.locked{opacity:.55;border-style:dashed}
.lvl{margin-bottom:10px}.lvl .num{display:inline-block;width:26px;height:26px;border-radius:50%;background:var(--soft);color:var(--accent);text-align:center;line-height:26px;font-weight:700;margin-right:8px}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
/* learn: lessons, quizzes */
.chipbtn{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:99px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.chipbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-bottom:16px}
.lessonbtn{display:grid;grid-template-columns:110px 1fr;gap:12px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;padding:10px;align-items:center}
.lessonbtn b{display:block;margin:2px 0}.lessonbtn small{display:block}.lessonbtn .tag{margin-top:4px}
.lthumb svg,.ldiagram svg{display:block;width:100%;height:auto;border-radius:6px}
.quizcard{max-width:720px;margin-bottom:12px}.quizcard textarea{margin:6px 0}
.qa{border-top:1px solid var(--line);margin-top:10px;padding-top:10px;font-size:14px}
.player{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}.player .bar{height:10px;border-radius:99px}
.player .lcard{font-size:18px;line-height:1.5;margin:14px 0}.metaphor{font-style:italic;color:var(--muted);margin:10px 0 0}
.ldiagram{margin-bottom:12px}.player>.btn{align-self:flex-start}
.welcome{border-color:var(--accent);background:linear-gradient(180deg,var(--soft),var(--card) 70%)}
.behind{margin-top:10px;font-size:14px}
.nextstep{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.todo{margin:8px 0 0;padding-left:18px}.todo li{margin:4px 0}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--accent);text-align:left;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:99px;background:var(--warn);color:#fff;font-size:11px;line-height:18px;text-align:center;font-weight:700}
.bar.money{display:flex;height:10px}.bar.money i.owed{background:var(--gold)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;cursor:pointer}
.opt.right{border-color:var(--good)}.opt.wrong{border-color:var(--bad)}
.result.pass{border-color:var(--good)}.result.fail{border-color:var(--bad)}
.dg .sky{fill:var(--sky)}
.dg .meadow{fill:var(--meadow)}
.dg .soil{fill:var(--soil)}
.dg .soil2{fill:var(--soil2)}
.dg .rocky{fill:var(--soil2)}
.dg .rock{fill:var(--rock)}
.dg .leaf{fill:var(--leaf)}
.dg .leaf2{fill:var(--leaf2)}
.dg .stem{stroke:var(--leaf);stroke-width:2.5;fill:none;stroke-linecap:round}
.dg .bloom{fill:var(--bloom)}
.dg .gold{fill:var(--gold)}
.dg .apple{fill:var(--apple)}
.dg .sky2{fill:var(--sky2)}
.dg .wilt{fill:var(--rock)}
.dg .trunk{fill:var(--trunk)}
.dg .trunkl{stroke:var(--trunk);stroke-width:2.5;fill:none;stroke-linecap:round}
.dg .root{stroke:var(--soil2);fill:none;stroke-linecap:round}
.dg .skin{fill:var(--skin)}
.dg .shirt1{fill:var(--accent)}
.dg .shirt2{fill:var(--sky2)}
.dg .shirt3{fill:var(--bloom)}
.dg .ink{fill:var(--ink)}
.dg .paper{fill:var(--paper);stroke:var(--line);stroke-width:1.2}
.dg .pbad{stroke:var(--bad);stroke-width:1.8}
.dg .pgood{stroke:var(--good);stroke-width:1.8}
.dg .t{fill:var(--ink);font-family:Inter,system-ui,sans-serif;font-weight:600}
.dg .tm{fill:var(--muted)}
.dg .onsoil{fill:var(--onsoil)}
.dg .bad{fill:var(--bad)}
.dg .good{fill:var(--good)}
.dg .ar{stroke:var(--ink);stroke-width:1.8;fill:none}
.dg .arh{fill:var(--ink)}
.dg .ag{stroke:var(--gold-d);stroke-width:2.2;fill:none}
.dg .agh{fill:var(--gold-d)}
.dg .ab{stroke:var(--sky2);stroke-width:1.6;fill:none}
.dg .abh{fill:var(--sky2)}
.dg .xbad{stroke:var(--bad);stroke-width:3.5;stroke-linecap:round;fill:none}
.dg .okbg{fill:var(--good)}
.dg .okl{stroke:var(--card);stroke-width:2.5;fill:none;stroke-linecap:round}
.dg .weave{stroke:var(--trunk);stroke-width:1;fill:none;opacity:.6}
.dg .ray{stroke:var(--gold);stroke-width:2.2;stroke-linecap:round}
.dg .rail{stroke:var(--trunk);stroke-width:3;fill:none}
.dg .trail{stroke:var(--soil2);stroke-width:14;fill:none;stroke-linecap:round}
.dg .trail2{stroke:var(--soil2);stroke-width:10;fill:none}
.dg .barn{fill:var(--apple)}
.dg .roofl{stroke:var(--ink);stroke-width:3;fill:none}
.dg .beak{fill:var(--gold-d)}
.dg .bird{fill:var(--sky2)}
.dg .puff{fill:var(--paper);stroke:var(--line)}
.dg .seedl{stroke:var(--muted);stroke-width:1;fill:none}
.dg .cloudf{fill:var(--paper);stroke:var(--line)}
.dg .breeze{stroke:var(--sky2);stroke-width:2;fill:none;stroke-linecap:round}
.dg .phone{fill:var(--ink)}
.dg .axis{stroke:var(--muted);stroke-width:1}
.dg .axisl{stroke:none}
.dg .owl{fill:var(--soil2)}
.dg .arm{stroke:var(--skin);stroke-width:4;stroke-linecap:round;fill:none}
.dg .lead{stroke:var(--muted);stroke-width:1;fill:none}
.dg .stripe{stroke:var(--ink);stroke-width:2.5}
.dg .wing{fill:var(--paper);opacity:.85;stroke:var(--line)}
.dg .wasp{fill:var(--gold-d)}
.dg .web{stroke:var(--muted);stroke-width:.8;fill:none;opacity:.7}
.dg .node{fill:var(--paper);stroke:var(--leaf);stroke-width:2}
.dg .ladderl{stroke:var(--trunk);stroke-width:4;stroke-linecap:round;fill:none}
.dg .motion{stroke:var(--muted);stroke-width:1.5;stroke-linecap:round}
.dg .water{stroke:var(--sky2);stroke-width:3;fill:none;opacity:.6}
.dg .ghost{fill:none;stroke:var(--muted);stroke-dasharray:3 3}
.dg .shear{stroke:var(--muted);stroke-width:3;stroke-linecap:round}
.dg .shearo{fill:none;stroke:var(--muted);stroke-width:2}
.dg .tag{stroke:var(--muted);stroke-width:1.2}
.dg .pot{fill:var(--apple)}
.dg .awning{fill:var(--apple)}
.dg .awnl{stroke:var(--paper);stroke-width:4}
@media (max-width:640px){main{padding:16px}.lessonbtn{grid-template-columns:90px 1fr}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header id="top" hidden>
  <h1 id="brand"></h1>
  <nav id="nav"></nav>
  <span class="muted" id="who"></span>
  <button class="btn ghost sm" id="logout">Sign out</button>
</header>
<div id="banner"></div>
<main id="app"></main>
<dialog id="dlg"></dialog>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const C = window.CRM_CONFIG;
let recovering = /type=recovery/.test(location.hash + location.search);
let linkError = new URLSearchParams(location.hash.slice(1)).get("error_description");
const sb = createClient(C.SUPABASE_URL, C.SUPABASE_KEY);
const $ = (s) => document.querySelector(s);
const app = $("#app"), dlg = $("#dlg");
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = (n) => "$" + Number(n || 0).toLocaleString(undefined, {maximumFractionDigits: 2});
const PER_TRADE = 10;
let me = null, stages = [], trades = [], view = "home";
$("#brand").textContent = C.PROGRAM_NAME;
const REF = new URLSearchParams(location.search).get("ref") || ""; // referral links: leadfarminghq.com/?ref=friend@email

// ---------- auth ----------
function authView(mode = "in") {
  $("#top").hidden = true;
  if (linkError) history.replaceState(null, "", location.pathname);
  if (mode === "forgot") return forgotView();
  app.innerHTML = `<div class="auth card">
    <h2 style="margin-top:0">${mode === "in" ? "Sign in" : "Create your account"}</h2>
    <form id="af">
      ${mode === "up" ? `<label>Full name</label><input name="full_name" required>
      <label>Phone</label><input name="phone">
      <label>Who referred you? (their email, optional)</label><input name="recruiter_email" type="email" value="${esc(REF)}">` : ""}
      <label>Email</label><input name="email" type="email" required>
      <label>Password</label><input name="password" type="password" minlength="8" required>
      ${mode === "in" ? `<p style="margin:6px 0 0;font-size:13px;text-align:right"><a href="#" id="fg">Forgot password?</a></p>` : ""}
      <div class="err" id="aerr">${linkError ? esc(linkError) + ". Use Forgot password? to get a new link." : ""}</div>
      <button class="btn" style="width:100%;margin-top:8px">${mode === "in" ? "Sign in" : "Sign up"}</button>
    </form>
    <p class="muted" style="font-size:14px">${mode === "in"
      ? `New farmer? <a href="#" id="sw">Create an account</a>`
      : `Already have an account? <a href="#" id="sw">Sign in</a>`}</p></div>`;
  $("#sw").onclick = (e) => { e.preventDefault(); authView(mode === "in" ? "up" : "in"); };
  linkError = null;
  if ($("#fg")) $("#fg").onclick = (e) => { e.preventDefault(); authView("forgot"); };
  $("#af").onsubmit = async (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    const { error } = mode === "in"
      ? await sb.auth.signInWithPassword({ email: f.email, password: f.password })
      : await sb.auth.signUp({ email: f.email, password: f.password,
          options: { emailRedirectTo: location.origin + location.pathname,
            data: { full_name: f.full_name, phone: f.phone, recruiter_email: f.recruiter_email } } });
    if (error) return ($("#aerr").textContent = error.message);
    if (mode === "up") $("#aerr").textContent = "Check your email to confirm your account, then sign in.";
  };
}
function forgotView() {
  app.innerHTML = `<div class="auth card">
    <h2 style="margin-top:0">Reset your password</h2>
    <p class="muted" style="font-size:14px;margin-top:0">Enter your account email and we'll send you a link to set a new password.</p>
    <form id="ff"><label>Email</label><input name="email" type="email" required>
      <div class="err" id="ferr"></div>
      <button class="btn" style="width:100%;margin-top:8px">Send reset link</button></form>
    <p class="muted" style="font-size:14px"><a href="#" id="sw">Back to sign in</a></p></div>`;
  $("#sw").onclick = (e) => { e.preventDefault(); authView("in"); };
  $("#ff").onsubmit = async (e) => {
    e.preventDefault();
    const email = new FormData(e.target).get("email");
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    $("#ferr").textContent = error ? error.message : "If that email has an account, a reset link is on its way. Check your inbox.";
  };
}

function newPasswordView() {
  $("#top").hidden = true;
  app.innerHTML = `<div class="auth card">
    <h2 style="margin-top:0">Set a new password</h2>
    <form id="nf"><label>New password</label><input name="password" type="password" minlength="8" required>
      <label>Confirm new password</label><input name="confirm" type="password" minlength="8" required>
      <div class="err" id="nerr"></div>
      <button class="btn" style="width:100%;margin-top:8px">Save new password</button></form></div>`;
  $("#nf").onsubmit = async (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    if (f.password !== f.confirm) return ($("#nerr").textContent = "Passwords don't match.");
    const { error } = await sb.auth.updateUser({ password: f.password });
    if (error) return ($("#nerr").textContent = error.message);
    recovering = false;
    history.replaceState(null, "", location.pathname);
    const { data } = await sb.auth.getSession();
    signedIn(data.session);
  };
}

$("#logout").onclick = () => { view = "home"; sb.auth.signOut().then(() => ($("#banner").innerHTML = "")); };

sb.auth.onAuthStateChange((event, session) => {
  if (event === "USER_UPDATED") return; // new password saved; the form handles what's next
  if (event === "PASSWORD_RECOVERY") recovering = true;
  if (recovering && session) return newPasswordView();
  // supabase-js warns against awaiting its own calls inside this callback
  setTimeout(() => signedIn(session));
});

async function signedIn(session) {
  if (!session) { me = null; return authView(); }
  const { data } = await sb.from("profiles").select("*").eq("id", session.user.id).single();
  if (me?.id !== data?.id) view = "home";  // every sign-in opens on Home
  me = data;
  await loadRef();
  boot();
}

async function loadRef() {
  [stages, trades] = await Promise.all([
    sb.from("stages").select("*").order("id").then((r) => r.data || []),
    sb.from("trades").select("*").order("sort_order").order("name").then((r) => r.data || []),
  ]);
}
const stageName = (id) => stages.find((s) => s.id === id)?.name || id;
const tradeName = (id) => trades.find((t) => t.id === id)?.name || "—";

const locked = () => me?.role !== "admin" && !me?.verifier && !me?.enrollment_paid;
const lvl = () => (me?.role === "admin" ? 3 : me?.level || 0);
const reviewer = () => me?.role === "admin" || me?.verifier;

// Unpaid accounts get only this screen; the database also refuses them any program data.
function payView() {
  $("#nav").innerHTML = ""; $("#banner").innerHTML = "";
  const link = C.PAYMENT_LINK && `${C.PAYMENT_LINK}?client_reference_id=${encodeURIComponent(me.id)}&prefilled_email=${encodeURIComponent(me.email || "")}`;
  app.innerHTML = `<div class="auth card" id="paywall">
    <h2 style="margin-top:0">Finish your enrollment</h2>
    <p>Welcome${me.full_name ? ", " + esc(me.full_name) : ""}. The ${esc(C.PROGRAM_NAME)} opens once your one-time $500 enrollment is paid.</p>
    ${link ? `<a class="btn" style="display:block;text-align:center;text-decoration:none" id="pay" href="${esc(link)}">Pay $500 by card</a>` : ""}
    ${C.ZELLE_TO ? `<p class="muted">Or Zelle $500 to <b>${esc(C.ZELLE_TO)}</b> with <b>${esc(me.email)}</b> in the memo. We'll unlock your account once it arrives.</p>` : ""}
    <p class="muted" style="font-size:14px">Already paid? It can take a minute to show up.</p>
    <button class="btn ghost" style="width:100%" id="recheck">Check again</button>
    <div class="err" id="perr"></div></div>`;
  $("#recheck").onclick = () => recheck();
}
async function recheck(quiet = false) {
  const { data } = await sb.from("profiles").select("*").eq("id", me.id).single();
  if (data) me = data;
  if (!locked()) { await loadRef(); return boot(); }
  const e = $("#perr"); if (e && !quiet) e.textContent = "We haven't received your payment yet.";
}
window.addEventListener("focus", () => { if (me && locked() && $("#paywall")) recheck(true); });

function boot() {
  $("#top").hidden = false;
  $("#who").textContent = me?.full_name || me?.email || "";
  if (locked()) return payView();
  const tabs = [["home","Home"],["learn","Learn"]];
  if (me?.role !== "admin" && me?.enrollment_paid) tabs.push(["program","90 days"]);
  tabs.push(["pipeline","Pipeline"],["contractors","Contractors"]);
  if (lvl() >= 2) tabs.push(["leads","Leads"]);
  if (lvl() >= 3) tabs.push(["upsells","Upsells"]);
  if (lvl() >= 2 && me?.role !== "admin") tabs.push(["money","Money"]);
  if (reviewer()) tabs.push(["approvals","Approvals"]);
  if (me?.role === "admin") tabs.push(["admin","Farmers"],["payouts","Payouts"],["trades","Trades"],["welcome","Welcome"]);
  if (!tabs.some(([k]) => k === view)) view = "home";
  $("#nav").innerHTML = tabs.map(([k,l]) => `<button data-v="${k}" class="${k===view?"on":""}">${l}</button>`).join("");
  $("#nav").onclick = (e) => { const b = e.target.closest("button"); if (b?.dataset.v) { view = b.dataset.v; boot(); } };
  approvalsBadge();
  ({ home, learn, program, pipeline, contractors, leads, upsells, money: moneyView, welcome: welcomeLines, approvals, admin, payouts, tradesView: tradesView })[view === "trades" ? "tradesView" : view]();
}

// ---------- farmer: home (level ladder + next step) ----------
async function home() {
  // pick up an approval that happened since sign-in
  const { data: fresh } = await sb.from("profiles").select("*").eq("id", me.id).single();
  if (fresh && fresh.level !== me.level) { me = fresh; await loadRef(); return boot(); }
  const [{ data: ladder }, { data: reqs }, cs, { data: passes }] = await Promise.all([
    sb.rpc("level_ladder"),
    sb.from("level_requests").select("*").eq("farmer_id", me.id).order("created_at", { ascending: false }),
    myContractors(),
    sb.from("quiz_passes").select("quiz").eq("farmer_id", me.id),
  ]);
  const L = lvl(), last = (reqs || [])[0], pending = last?.status === "pending";
  const top = Math.max(0, ...cs.filter((c) => c.farmer_id === me.id).map((c) => c.stage));
  const ready = (L === 1 && top >= 3) || (L === 2 && top >= 6);
  const aced = (passes || []).some((p) => p.quiz === "l" + L);
  const refLink = `${location.origin}${location.pathname}?ref=${encodeURIComponent(me.email || "")}`;
  const card = (l) => {
    if (l.level === 0) return "";
    if (l.level <= L) return `<div class="card lvl"><span class="num">${l.level}</span><b>${esc(l.name)}</b> <span class="tag">unlocked</span></div>`;
    if (l.level === L + 1) return `<div class="card lvl" id="next"><span class="num">${l.level}</span><b>${esc(l.name)}</b>
      <p style="margin:8px 0">${esc(l.requirement || "")}</p>
      ${pending ? `<span class="tag">Request sent, waiting for review</span>`
        : `${last?.status === "rejected" && last.to_level === l.level ? `<p class="err">Sent back${last.review_note ? ": " + esc(last.review_note) : ""}. Add more proof and ask again.</p>` : ""}
           <p style="margin:8px 0;font-size:14px">${aced ? "✓ Level " + L + " quiz aced" : `<b>Also ace the Level ${L} quiz.</b> <a href="#" id="toquiz">Go to your lessons</a>`}</p>
           ${ready && aced ? `<button class="btn" id="askup">Request level ${l.level}</button>` : `<span class="muted" style="font-size:14px">The request button appears once you've reached this goal and aced the quiz.</span>`}`}</div>`;
    return `<div class="card lvl locked"><span class="num">${l.level}</span><span class="muted">${esc(l.teaser)}</span></div>`;
  };
  app.innerHTML = `<div style="max-width:720px">
    <h2 style="font-size:18px;margin-top:0">Your progress</h2>
    ${me.role === "admin" ? `<p class="muted">Admins see every level.</p>` : (ladder || []).map(card).join("")}
    ${me.role !== "admin" ? `<div class="card lvl" id="refcard" style="margin-top:20px"><b>Know someone who'd be good at this?</b>
      <p style="margin:6px 0">Introduce them and earn $250 when they enroll. Share your link:</p>
      <div class="row"><input id="reflink" readonly value="${esc(refLink)}" style="flex:1"><button class="btn ghost sm" id="copyref">Copy</button></div></div>` : ""}</div>`;
  if ($("#copyref")) $("#copyref").onclick = () => { $("#reflink").select(); navigator.clipboard?.writeText($("#reflink").value).catch(() => {}); $("#copyref").textContent = "Copied"; };
  if ($("#askup")) $("#askup").onclick = () => requestForm(L + 1);
  if (me.role !== "admin") await homeExtras(cs, { L, aced, ready, pending });
  if ($("#toquiz")) $("#toquiz").onclick = (e) => { e.preventDefault(); learnQuiz = "l" + L; view = "learn"; boot(); };
}

function requestForm(to) {

// ---------- farmer: the 90-day refund program ----------
const DAY = 864e5;
const onDay = (t0, n) => new Date(new Date(t0).getTime() + n * DAY).toLocaleDateString();
const csvOf = (rows) => {
  const cols = [...new Set(rows.flatMap((r) => Object.keys(r)))];
  const cell = (v) => { const s = v == null ? "" : String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  return [cols.join(","), ...rows.map((r) => cols.map((c) => cell(r[c])).join(","))].join("\n");
};
const download = (name, text) => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "text/csv" })); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
// CRM records as CSV files, straight from the database (the reviewer checks the package against these)
const evidenceButtons = (key) => ["contractors", "calls", "comments", "leads", "upsells"]
  .map((k) => `<button class="btn ghost sm" data-ev="${k}" data-evf="${key}">${k[0].toUpperCase() + k.slice(1)} CSV</button>`).join(" ");
const wireEvidence = (farmer, who) => app.querySelectorAll(`[data-evf="${farmer || "me"}"]`).forEach((b) => b.onclick = async () => {
  const { data, error } = await sb.rpc("refund_evidence", farmer ? { p_farmer: farmer } : {});
  if (error) return alert(error.message);
  download(`${who}-${b.dataset.ev}.csv`.replace(/[^\w.-]+/g, "_"), csvOf(data[b.dataset.ev] || []));
});
const progressTable = (pr) => `<div class="tablewrap"><table><thead><tr><th>Step</th><th>Goal</th><th>Due</th><th>Where you are</th><th></th></tr></thead><tbody>
  ${pr.steps.map((s) => `<tr data-step="${s.n}"><td><b>${s.n}. ${esc(s.name)}</b></td><td>${esc(s.quota)}</td>
    <td style="white-space:nowrap">Day ${s.deadline}<br><small class="muted">${onDay(pr.paid_at, s.deadline)}</small></td>
    <td>${esc(s.progress)}</td><td>${s.met ? `<span class="tag">Met</span>` : pr.day > s.deadline ? `<span class="tag warn">Missed</span>` : `<span class="muted">Open</span>`}</td></tr>`).join("")}
  ${pr.rules.map((r) => `<tr><td colspan="3"><b>${esc(r.name)}</b></td><td>${esc(r.progress)}</td><td>${r.met ? `<span class="tag">Met</span>` : `<span class="muted">Open</span>`}</td></tr>`).join("")}

      : `<p style="margin:6px 0">List 15 different, non-overlapping business models in your niche, one per line. Due day 3 (${onDay(pr.paid_at, 3)}).</p>
        ${pr.niche_note ? `<p class="err">Sent back: ${esc(pr.niche_note)}</p>` : ""}

  });
  $("#clog").onclick = async () => {

const ago = (t) => (Date.now() - new Date(t).getTime()) / DAY;

// Follow-ups worked out from the farmer's own records; each opens the thing to do
async function todayList(cs) {
  const mine = cs.filter((c) => c.farmer_id === me.id);
  const [{ data: calls }, { data: ls }, { data: pr }] = await Promise.all([
    sb.from("activities").select("*").eq("farmer_id", me.id).eq("kind", "call"),
    lvl() >= 2 ? sb.from("leads").select("*").eq("farmer_id", me.id) : Promise.resolve({ data: [] }),
    sb.rpc("refund_progress"),
  ]);
  const byC = {};
  for (const a of calls || []) (byC[a.contractor_id] ||= []).push(a);
  for (const k in byC) byC[k].sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  const items = [];
  for (const c of mine) {
    const cl = byC[c.id] || [], lastCall = cl[0];
    if (lastCall?.outcome === "call back" && ago(lastCall.created_at) >= 2) items.push({ c, text: `Call ${c.business_name} back. They asked you to on ${new Date(lastCall.created_at).toLocaleDateString()}.` });
    else if (cl.some((a) => a.outcome === "agreed") && !cl.some((a) => a.text_sent)) items.push({ c, text: `Send ${c.business_name} the 20% text. They said yes.` });
    else if (c.stage === 2 && ago(lastCall?.created_at || c.updated_at) >= 3) items.push({ c, text: `Follow up with ${c.business_name}. No call logged in 3 days.` });
  }
  const cname = (id) => cs.find((c) => c.id === id)?.business_name || "the contractor";
  for (const l of ls || []) {
    if (l.direction === "outbound" && ["new", "sent"].includes(l.status) && ago(l.created_at) >= 7) items.push({ l, text: `Check on the lead you sent ${cname(l.contractor_id)}${l.customer_name ? ` for ${l.customer_name}` : ""}. Did it close?` });
    if (l.status === "closed" && !l.fee_paid && ago(l.closed_at || l.created_at) >= 14) items.push({ l, text: `Collect your ${money(l.fee_amount)} fee from ${cname(l.contractor_id)}. The job closed over 2 weeks ago.` });
  }
  if (pr?.enrolled && pr.day >= 7 && pr.day <= 90 && pr.comments_today < 50) items.push({ go: "program", text: `Post your neighbor comments. ${pr.comments_today} of 50 logged today.` });
  for (const s of pr?.steps || []) if (!s.met && s.deadline - pr.day >= 0 && s.deadline - pr.day <= 3)
    items.push({ go: "program", text: `${s.name} is due ${s.deadline === pr.day ? "today" : "in " + (s.deadline - pr.day) + " day" + (s.deadline - pr.day > 1 ? "s" : "")}: ${s.progress}.` });
  return { items, ls: ls || [], pr };
}

// One greeting per visit, in turn, from the lines Alex keeps in the Welcome tab
const greetingFrom = (lines) => {
  if (!lines?.length) return `Welcome back, ${firstName()}.`;
  const key = "lf-greet-" + me.id;
  let i = 0;
  try { i = (+(localStorage.getItem(key) ?? -1) + 1) % lines.length; localStorage.setItem(key, i); } catch { i = Math.floor(Math.random() * lines.length); }
  return lines[i].body.replaceAll("{name}", firstName());
};
const firstName = () => (me.full_name || "").trim().split(/\s+/)[0] || "farmer";

// What to do right now, in order of what unblocks the most
function nextStep({ L, aced, ready, pending }, pr, items) {
  const s0 = pr?.enrolled && pr.steps[0];
  if (s0 && !s0.met && pr.day <= 3 && !["Approved", "Waiting for review"].includes(s0.progress))
    return { text: "Send in your 15 business models. They're due on day 3.", go: "program", btn: "Open 90 days" };
  if (L < 3 && !aced) return { text: `Go through your Level ${L} lessons and ace the quiz. It shows you exactly what to do next.`, go: "learn", btn: "Open lessons" };
  if (L < 3 && ready && !pending) return { text: `You've reached the Level ${L + 1} goal. Send your proof and ask to move up.`, go: "next", btn: "Request it" };
  if (pending) return { text: `Your Level ${L + 1} request is with Alex. Keep logging your work while you wait.`, go: items[0] ? "todo" : "program", btn: items[0] ? "Start" : "Open 90 days" };
  const open = pr?.enrolled && pr.steps.find((x) => !x.met && x.deadline >= pr.day);
  if (items[0]) return { text: items[0].text, go: "todo", btn: "Do it" };
  if (open) return { text: `Keep working on step ${open.n}, ${open.name}: ${open.quota}. You're at ${open.progress}.`, go: "program", btn: "Open 90 days" };
  return { text: "Log today's calls and comments so your streak stays alive.", go: "program", btn: "Open 90 days" };
}

async function homeExtras(cs, ctx) {
  const [{ items, ls, pr }, { data: notes }, { data: refs }, { data: lines }] = await Promise.all([
    todayList(cs),

    sb.rpc("my_referrals"),
    sb.from("welcome_lines").select("*").order("id"),
  ]);
  const unread = (notes || []).filter((n) => !n.read_at);
  const missed = pr?.enrolled ? pr.steps.filter((x) => !x.met && x.deadline < pr.day) : [];
  const soon = pr?.enrolled ? pr.steps.filter((x) => !x.met && x.deadline >= pr.day && x.deadline - pr.day <= 7) : [];
  const nx = nextStep(ctx, pr, items);
  const behind = [...missed.map((x) => `Step ${x.n}, ${x.name}, was due on day ${x.deadline} and wasn't met (${x.progress}).`),
    ...soon.map((x) => `Step ${x.n}, ${x.name}, is due ${x.deadline === pr.day ? "today" : "in " + (x.deadline - pr.day) + " day" + (x.deadline - pr.day > 1 ? "s" : "")}. You're at ${x.progress}.`)];
  const greeting = greetingFrom(lines);
  const summary = [greeting,
    unread.length ? `You have ${unread.length} new alert${unread.length > 1 ? "s" : ""}. ${unread.map((n) => n.body).join(" ")}` : "No new alerts.",
    behind.length ? behind.join(" ") : pr?.enrolled ? `You're on day ${Math.min(pr.day, 90)} of 90 and nothing is overdue.` : "",
    `Your next step: ${nx.text}`].filter(Boolean).join(" ");
  app.firstElementChild.insertAdjacentHTML("afterbegin", `
    <div class="card lvl welcome" id="welcome"><div class="row"><h2 style="margin:0;flex:1;font-size:20px" id="greeting">${esc(greeting)}</h2>
      ${"speechSynthesis" in window ? `<button class="btn ghost sm" id="readout" title="Read this to me">🔊 Read it to me</button>` : ""}</div>
      ${behind.length ? `<div class="behind"><b>${missed.length ? "You're behind" : "Coming up"}</b><ul class="todo">${behind.map((b) => `<li>${esc(b)}</li>`).join("")}</ul></div>`
        : pr?.enrolled ? `<p class="muted" style="margin:8px 0 0">Day ${Math.min(pr.day, 90)} of 90. Nothing is overdue right now.</p>` : ""}
      <div class="nextstep"><span><small class="muted">Your next step</small><br><b id="nexttext">${esc(nx.text)}</b></span>
        <button class="btn" id="nextgo">${esc(nx.btn)}</button></div></div>
    ${unread.map((n) => `<div class="card lvl alert" style="border-color:var(--warn)"><div class="row"><span style="flex:1">${esc(n.body)}</span>
      <button class="btn ghost sm" data-seen="${n.id}">Got it</button></div></div>`).join("")}
    <div class="card lvl" id="today"><b>Today</b>${items.length
      ? `<ul class="todo">${items.map((x, i) => `<li><button class="linkbtn" data-todo="${i}">${esc(x.text)}</button></li>`).join("")}</ul>`
      : `<p class="muted" style="margin:6px 0 0">You're caught up. Nothing needs a follow-up right now.</p>`}</div>`);
  if (refs?.length) $("#refcard").insertAdjacentHTML("beforeend", `<div class="tablewrap" style="margin-top:12px" id="myrefs"><table><thead><tr><th>Your referrals</th><th>Status</th></tr></thead><tbody>
    ${refs.map((r) => `<tr><td>${esc(r.full_name)}<br><small class="muted">${new Date(r.created_at).toLocaleDateString()}</small></td><td>${esc(payoutLabel(r))}</td></tr>`).join("")}</tbody></table></div>`);
  $("#nextgo").onclick = () => {
    if (nx.go === "todo") return app.querySelector("[data-todo]")?.click();
    if (nx.go === "next") return $("#askup")?.click();
    if (nx.go === "learn") learnQuiz = "l" + ctx.L;
    view = nx.go; boot();
  };
  if ($("#readout")) $("#readout").onclick = () => {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(summary); u.rate = 1.02;

  };
  app.querySelectorAll("[data-seen]").forEach((b) => b.onclick = async () => {
    await sb.from("notifications").update({ read_at: new Date().toISOString() }).eq("id", b.dataset.seen);
    b.closest(".alert").remove();
  });
  app.querySelectorAll("[data-todo]").forEach((b) => b.onclick = () => {
    const x = items[+b.dataset.todo];
    if (x.c) contractorForm(x.c);
    else if (x.l) leadForm(x.l, cs);
    else { view = x.go; boot(); }
  });
}

        <td style="white-space:nowrap">${money(m.paid)} collected${m.owed ? ` · ${money(m.owed)} owed` : ""}<br><small class="muted">${m.jobs} job${m.jobs > 1 ? "s" : ""}</small></td></tr>`; }).join("")}</tbody></table>`

      : `<p class="muted" style="margin:6px 0 0">Nobody owes you right now.</p>`}<div class="err" id="moneyerr"></div></div>
    ${lvl() >= 3 ? `<div class="card" id="upsellmoney"><b>Upsells</b>

// One card at a time, then a practice question
function lessonView(list, li, step = 0) {
  const l = list[li], d = l.data, n = d.cards.length;
  const back = `<button class="btn ghost sm" id="lback">← All lessons</button>`;
  if (step < n) {
    app.innerHTML = `<div class="player">${back}<div class="bar"><i style="width:${(step / (n + 1)) * 100}%"></i></div>
      <div class="card"><div class="ldiagram">${svgOf(d)}</div><small class="muted">${esc(d.step)} · ${esc(d.title)}</small>
      ${step === 0 ? `<p class="metaphor">${esc(d.metaphor)}</p>` : ""}<p class="lcard">${esc(d.cards[step])}</p>
      <div class="row" style="justify-content:space-between"><span class="muted" style="font-size:13px">${step + 1} of ${n}</span>
      <span class="row">${step ? `<button class="btn ghost" id="lprev">Back</button>` : ""}<button class="btn" id="lnext">Next</button></span></div></div></div>`;
    $("#lnext").onclick = () => lessonView(list, li, step + 1);
    if ($("#lprev")) $("#lprev").onclick = () => lessonView(list, li, step - 1);
  } else {
    const c = d.check;
    app.innerHTML = `<div class="player">${back}<div class="bar"><i style="width:${(n / (n + 1)) * 100}%"></i></div>
      <div class="card"><small class="muted">Practice</small><p class="lcard"><b>${esc(c.q)}</b></p>
      <div class="opts">${c.o.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}</div>
      <p id="fb" class="muted" style="min-height:1.4em"></p>
      <div class="row" style="justify-content:flex-end"><button class="btn ghost" id="lprev">Back</button><button class="btn" id="lfin" hidden>${li + 1 < list.length ? "Next lesson" : "Finish"}</button></div></div></div>`;
    app.querySelectorAll(".opt").forEach((b) => b.onclick = () => {
      app.querySelectorAll(".opt").forEach((x) => x.classList.remove("right", "wrong"));
      const ok = +b.dataset.i === c.a;
      b.classList.add(ok ? "right" : "wrong");
      $("#fb").textContent = ok ? "Nice. That's it." : "Not quite. Try again.";
      if (ok) { markDone(l.id); $("#lfin").hidden = false; }
    });
    $("#lprev").onclick = () => lessonView(list, li, n - 1);
    $("#lfin").onclick = () => li + 1 < list.length ? lessonView(list, li + 1) : learn();
  }
  $("#lback").onclick = () => learn();
  window.scrollTo(0, 0);
}

// The quiz: shuffled questions and answers; graded by the database; misses point back to lessons
function quizView(Z, qq, mine) {
  const qs = shuffle(qq).map((x) => ({ ...x, order: shuffle(x.options.map((_, i) => i)) }));
  const answers = [];
  const show = (i) => {
    if (i >= qs.length) return submit();
    const x = qs[i];
    app.innerHTML = `<div class="player"><button class="btn ghost sm" id="qquit">Quit</button>
      <div class="bar"><i style="width:${(i / qs.length) * 100}%"></i></div>
      <div class="card"><small class="muted">${esc(quizLabel(Z))} quiz · question ${i + 1} of ${qs.length}</small>
      <p class="lcard"><b>${esc(x.q)}</b></p>
      <div class="opts">${x.order.map((oi) => `<button class="opt" data-i="${oi}">${esc(x.options[oi])}</button>`).join("")}</div></div></div>`;
    app.querySelectorAll(".opt").forEach((b) => b.onclick = () => { answers[x.idx] = +b.dataset.i; show(i + 1); });
    $("#qquit").onclick = () => learn();
  };
  const submit = async () => {
    app.innerHTML = `<div class="player"><div class="card muted">Checking your answers…</div></div>`;
    const full = qq.map((x) => answers[x.idx] ?? -1);
    const { data: r, error } = await sb.rpc("submit_quiz", { p_quiz: Z.key, p_answers: full });
    if (error) return (app.innerHTML = `<div class="player"><div class="card"><p class="err">${esc(error.message)}</p><button class="btn" id="qback">Back</button></div></div>`, $("#qback").onclick = () => learn());
    const review = mine.filter((l) => (r.review || []).includes(l.id));
    app.innerHTML = `<div class="player"><div class="card result ${r.passed ? "pass" : "fail"}">
      <h2 style="margin:0 0 6px">${r.passed ? `🎉 Aced it: ${r.total} of ${r.total}` : `${r.score} of ${r.total}. You need every one.`}</h2>
      <p>${r.passed ? (Z.key === "rec" ? "You can ask a teacher about recruiting now." : "You can ask a teacher about this level now, and request the next level once you've reached its goal and have your proof.")
        : "Review these lessons, then try again:"}</p>
      ${review.map((l) => `<button class="btn ghost sm" data-rl="${l.id}" style="margin:0 6px 6px 0">${esc(l.data.title)}</button>`).join("")}
      <div class="row" style="margin-top:10px"><button class="btn" id="qagain">${r.passed ? "Back to lessons" : "Try again"}</button></div></div></div>`;
    app.querySelectorAll("[data-rl]").forEach((b) => b.onclick = () => lessonView(mine, mine.findIndex((l) => l.id === b.dataset.rl)));
    $("#qagain").onclick = () => r.passed ? learn() : quizView(Z, qq, mine);
  };
  show(0);
}

  ]);
  const nm = (id) => (pr || []).find((p) => p.id === id)?.full_name || "—";
  const owed = (ps || []).filter((p) => p.status === "owed").reduce((a, p) => a + Number(p.amount), 0);
  const back = (ps || []).filter((p) => p.clawback_at && !p.clawback_settled_at).reduce((a, p) => a + Number(p.amount), 0);
  app.innerHTML = `<div class="stats"><div class="card stat"><div class="v">${money(owed)}</div><div class="k">Recruiter payouts owed</div></div>
    ${back ? `<div class="card stat"><div class="v">${money(back)}</div><div class="k">Clawbacks owed back to you</div></div>` : ""}</div>
    <div class="card tablewrap"><table><thead><tr><th>Recruiter</th><th>New farmer</th><th>Amount</th><th>Status</th><th></th></tr></thead><tbody>
    ${(ps || []).map((p) => `<tr><td>${esc(nm(p.recruiter_id))}</td><td>${esc(nm(p.recruit_id))}</td><td>${money(p.amount)}</td>
      <td><span class="tag ${p.status === "owed" || (p.clawback_at && !p.clawback_settled_at) ? "warn" : ""}">${esc(payoutLabel(p).replace("$250 owed to you", "owed").replace(" (they were refunded)", ", recruit refunded"))}</span></td>
      <td>${p.status === "owed" ? `<button class="btn sm" data-paid="${p.id}">Mark paid</button>`
        : p.clawback_at && !p.clawback_settled_at ? `<button class="btn ghost sm" data-repaid="${p.id}">Mark repaid</button>` : ""}</td></tr>`).join("")
      || `<tr><td colspan="5" class="muted">No recruiter payouts yet.</td></tr>`}
    </tbody></table></div>`;
  app.querySelectorAll("[data-repaid]").forEach((b) => b.onclick = async () => {
    await sb.from("recruiter_payouts").update({ clawback_settled_at: new Date().toISOString() }).eq("id", b.dataset.repaid); boot();
  });
  app.querySelectorAll("[data-paid]").forEach((b) => b.onclick = async () => {
    await sb.from("recruiter_payouts").update({ status: "paid", paid_at: new Date().toISOString() }).eq("id", b.dataset.paid); boot();
  });
}

// ---------- admin: the welcome-back greetings ----------
async function welcomeLines() {
  const { data: lines } = await sb.from("welcome_lines").select("*").order("id");
  app.innerHTML = `<div class="card" style="max-width:720px"><h2 style="margin-top:0;font-size:18px">Welcome-back greetings</h2>
    <p class="muted">Farmers see the next one each time they open Home. Write {name} where their first name goes.</p>
    <table><tbody>${(lines || []).map((l) => `<tr><td>${esc(l.body)}</td><td style="text-align:right;white-space:nowrap">
      <button class="btn ghost sm" data-wedit="${l.id}">Edit</button> <button class="btn ghost sm" data-wdel="${l.id}">Remove</button></td></tr>`).join("")
      || `<tr><td class="muted">No greetings yet. Farmers will see "Welcome back".</td></tr>`}</tbody></table>
    <form id="wf" class="row" style="margin-top:12px"><input name="body" placeholder="Welcome back, {name}. …" required maxlength="300" style="flex:1"><button class="btn">Add</button></form>
    <div class="err" id="werr"></div></div>`;
  const done = ({ error }) => error ? ($("#werr").textContent = error.message) : welcomeLines();
  $("#wf").onsubmit = async (e) => { e.preventDefault(); done(await sb.from("welcome_lines").insert({ body: new FormData(e.target).get("body").trim() })); };
  app.querySelectorAll("[data-wdel]").forEach((b) => b.onclick = async () => done(await sb.from("welcome_lines").delete().eq("id", +b.dataset.wdel)));
  app.querySelectorAll("[data-wedit]").forEach((b) => b.onclick = async () => {
    const l = lines.find((x) => x.id === +b.dataset.wedit), body = prompt("Edit the greeting ({name} = their first name)", l.body);
    if (body && body.trim() !== l.body) done(await sb.from("welcome_lines").update({ body: body.trim() }).eq("id", l.id));
  });
}

async function tradesView() {
  app.innerHTML = `<div class="card" style="max-width:560px"><h2 style="margin-top:0;font-size:18px">Trades in the niche</h2>
    <p class="muted">Every farmer works toward ${PER_TRADE} contractors per trade.</p>
    <table><tbody>${trades.map((t) => `<tr><td>${esc(t.name)}</td><td style="text-align:right"><button class="btn ghost sm" data-del="${t.id}">Remove</button></td></tr>`).join("")}</tbody></table>
    <form id="tf" class="row" style="margin-top:12px"><input name="name" placeholder="Add a trade, e.g. Roofing" required style="flex:1"><button class="btn">Add</button></form>
    <div class="err" id="terr"></div></div>`;
  $("#tf").onsubmit = async (e) => {
    e.preventDefault();
    const name = new FormData(e.target).get("name").trim();
    const { error } = await sb.from("trades").insert({ name, sort_order: trades.length });
    if (error) return ($("#terr").textContent = error.message);
    await loadRef(); boot();
  };
  app.querySelectorAll("[data-del]").forEach((b) => b.onclick = async () => {
    const { error } = await sb.from("trades").delete().eq("id", +b.dataset.del);
    if (error) return ($("#terr").textContent = "Can't remove a trade that contractors are filed under.");
    await loadRef(); boot();
  });
}
</script>
</body>
</html>
